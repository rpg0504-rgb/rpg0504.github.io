<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2130">
<title>妖怪大樓救援隊</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#1b2130;touch-action:none;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
    color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block}
  .layer{position:fixed;inset:0;pointer-events:none;z-index:5}
  .layer.hidden,.hidden{display:none!important}
  .layer>*{pointer-events:auto}

  /* 觸控按鈕 */
  .btn{position:absolute;border:none;border-radius:50%;color:#fff;font-family:inherit;font-weight:800;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;
    background:rgba(20,26,40,.55);border:2px solid rgba(255,255,255,.35);backdrop-filter:blur(2px);
    text-shadow:0 1px 2px #000;touch-action:none}
  .btn.on{background:rgba(255,255,255,.3)}
  .btn small{font-size:10px;font-weight:600;opacity:.9;margin-top:2px}
  .btn .em{font-size:22px}
  #bAtk{width:96px;height:96px;right:calc(22px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));
    background:rgba(232,72,72,.62);border-color:rgba(255,220,220,.8);font-size:17px}
  #bAtk .em{font-size:30px}
  #bSwap{width:62px;height:62px;right:calc(128px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom))}
  #bHeal{width:62px;height:62px;right:calc(118px + env(safe-area-inset-right));bottom:calc(94px + env(safe-area-inset-bottom));background:rgba(220,60,110,.5)}
  #bId{width:62px;height:62px;right:calc(46px + env(safe-area-inset-right));bottom:calc(132px + env(safe-area-inset-bottom));background:rgba(60,110,220,.5)}
  #bRoll{width:56px;height:56px;right:calc(196px + env(safe-area-inset-right));bottom:calc(66px + env(safe-area-inset-bottom));background:rgba(230,140,40,.55)}
  #joyZone{position:absolute;left:0;top:70px;bottom:0;width:55%}

  /* 開車 */
  .arrow{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));width:110px;height:110px;border-radius:24px;font-size:46px}
  #dL{left:calc(18px + env(safe-area-inset-left))}
  #dR{right:calc(18px + env(safe-area-inset-right))}

  /* 家裡底部列 */
  #homeBar{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 12px}
  .pill{border:none;border-radius:30px;padding:12px 18px;font-size:16px;font-weight:800;font-family:inherit;color:#2a2010;
    background:#ffd65c;box-shadow:0 4px 0 #c79a1d;touch-action:manipulation}
  .pill:active{transform:translateY(3px);box-shadow:0 1px 0 #c79a1d}
  .pill.blue{background:#7cc7ff;box-shadow:0 4px 0 #3b8ccc}
  .pill.green{background:#8be07b;box-shadow:0 4px 0 #4a9d3c}
  .pill.red{background:#ff8a7a;box-shadow:0 4px 0 #c4483a}
  .pill:disabled{opacity:.45}

  /* 對話框 */
  #dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(640px,94vw);
    background:#fffaf0;color:#2a2416;border-radius:18px;padding:14px 18px 16px;z-index:30;border:4px solid #3a2f1c;box-shadow:0 8px 0 rgba(0,0,0,.35)}
  #dialog .who{font-weight:900;color:#c4483a;font-size:15px;margin-bottom:4px}
  #dialog .txt{font-size:18px;line-height:1.55;min-height:56px}
  #dialog .next{text-align:right;font-size:13px;color:#8a7a5a;margin-top:4px}

  /* 卡片 */
  .modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(10,12,20,.72);padding:12px}
  .card{width:min(560px,96vw);max-height:92vh;overflow:auto;background:#fffaf0;color:#2a2416;border-radius:20px;padding:18px 18px 20px;border:4px solid #3a2f1c;touch-action:pan-y}
  .card h2{font-size:22px;margin-bottom:8px}
  .card p{font-size:15px;line-height:1.6;margin:4px 0}
  .card .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:10px}
  .item{background:#fff;border:3px solid #e2d3b0;border-radius:14px;padding:10px 6px;text-align:center;font-family:inherit;color:#2a2416}
  .item .big{font-size:38px;line-height:1.2}
  .item .nm{font-weight:800;font-size:15px}
  .item .ds{font-size:12px;color:#7a6a4a;line-height:1.35;margin-top:2px}
  .item.sel{border-color:#ff9f1c;background:#fff2d6}
  .item.own{border-color:#8be07b;background:#effbe9}
  .tips{font-size:14px;line-height:1.7;padding-left:4px}
  .tips b{color:#c4483a}

  .pz{position:absolute;width:44px;height:44px;border-radius:50%;font-size:18px}
  #bPause{left:calc(192px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top))}
  #bRec{left:calc(242px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top))}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:8px}
  .st{background:#fff;border:3px solid #e2d3b0;border-radius:14px;padding:8px 6px;text-align:center}
  .st b{display:block;font-size:22px;color:#c4483a;font-variant-numeric:tabular-nums}
  .st span{font-size:12px;color:#7a6a4a;font-weight:700}
  .log{list-style:none;margin-top:6px;font-size:14px;line-height:1.6}
  .log li{padding:4px 8px;border-bottom:1px dashed #e2d3b0}
  .log small{color:#9c8a66;margin-right:6px;font-variant-numeric:tabular-nums}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-top:6px}
  .gal img{width:100%;aspect-ratio:1;border-radius:8px;border:2px solid #e2d3b0;background:#fff}
  .card h3{font-size:16px;margin-top:14px}
  #bPause2{right:calc(84px + env(safe-area-inset-right));top:calc(70px + env(safe-area-inset-top))}
  /* 畫畫比賽 */
  #drawUI{position:fixed;inset:0;z-index:35;background:#fdf3dc;color:#2a2416;display:flex;flex-direction:column;
    padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
  .dTop{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;padding:2px 4px 6px}
  .dTop .tp{flex:1;color:#c4483a;font-size:19px}
  .dTop .tm{background:#2a2416;color:#ffd65c;border-radius:12px;padding:2px 10px;min-width:56px;text-align:center}
  .dTop .tm.hurry{background:#e8483a;color:#fff}
  .dMain{flex:1;display:flex;gap:10px;align-items:center;justify-content:center;min-height:0}
  #dCanvas{background:#fff;border:4px solid #3a2f1c;border-radius:12px;touch-action:none;cursor:crosshair}
  .dRivals{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .rv{background:#fff;border:3px solid #e2d3b0;border-radius:10px;padding:3px;text-align:center;font-size:11px;font-weight:800}
  .rv canvas{display:block;background:#fff;border-radius:6px}
  .rv.done{border-color:#8be07b}
  .dTools{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding-top:6px}
  .sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #3a2f1c;touch-action:manipulation}
  .sw.sel{box-shadow:0 0 0 4px #ff9f1c}
  .sz{width:38px;height:34px;border-radius:10px;border:2px solid #3a2f1c;background:#fff;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  .sz.sel{background:#ffe2a8}
  .sz i{display:block;background:#2a2416;border-radius:50%}
  #dPauseBox{position:absolute;inset:0;background:rgba(253,243,220,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:900;font-size:22px}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
  .vc{background:#fff;border:3px solid #e2d3b0;border-radius:12px;padding:4px;text-align:center;font-family:inherit;color:#2a2416;font-weight:800;font-size:12px;position:relative}
  .vc img{width:100%;aspect-ratio:1;border-radius:8px;display:block;background:#fff}
  .vc.me{opacity:.7;border-style:dashed}
  .vc.pick{border-color:#ff9f1c;background:#fff2d6}
  .vc .vt{min-height:18px;font-size:14px}
  .vc .plus{position:absolute;top:-8px;right:-6px;background:#e8483a;color:#fff;border-radius:12px;padding:0 7px;font-size:13px}
  .rank{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:12px;background:#fff;margin:6px 0;font-weight:800}
  .rank.win{background:#fff2d6;border:3px solid #ffd65c}
  .rank .bar{flex:1;height:12px;background:#eee;border-radius:6px;overflow:hidden}
  .rank .bar i{display:block;height:100%;background:#ff9f1c}
  /* 3 樓：腳踏車特技秀 */
  .k3{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center;align-items:flex-end;flex-wrap:wrap;padding:0 12px}
  .kb{position:relative;width:76px;height:76px;border-radius:20px;font-size:30px;flex:none}
  .kb small{font-size:12px}
  .kb.wide{width:120px}
  #b3Pause{right:calc(66px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top))}
  #b3Rec{right:calc(14px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top))}
  .shopRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:3px solid #e2d3b0;border-radius:14px;padding:8px 10px;margin-top:8px}
  .shopRow .slot{font-weight:900;min-width:96px}
  .shopRow button{border:2px solid #3a2f1c;border-radius:12px;background:#fffaf0;padding:6px 8px;font-family:inherit;font-weight:800;font-size:13px;color:#2a2416}
  .shopRow button.cur{background:#effbe9;border-color:#4a9d3c}
  .shopRow button:disabled{opacity:.4}
  /* 4 樓村莊與對戰 */
  #ctl4 .act{position:absolute;right:calc(22px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));font-size:18px;padding:16px 20px}
  #ctl4 .act.hidden{display:none}
  #v4Pet{right:calc(118px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));width:54px;height:54px}
  #v4Pause{right:calc(66px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top))}
  #v4Rec{right:calc(14px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top))}
  #bt4{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:8px calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:stretch}
  #bt4 .msg{flex:1 1 100%;background:#fffaf0;color:#2a2416;border:3px solid #3a2f1c;border-radius:14px;padding:8px 12px;font-weight:800;font-size:15px;min-height:42px}
  #bt4 .mv{flex:1 1 40%;max-width:220px;border:3px solid #3a2f1c;border-radius:14px;padding:8px 6px;font-family:inherit;font-weight:900;font-size:15px;color:#2a2416;text-align:center;touch-action:manipulation}
  #bt4 .mv small{display:block;font-size:11px;font-weight:700;opacity:.8}
  #bt4 .mv:disabled{opacity:.45}
  #bt4 .dodge{background:#d9ecff}
  .petCard{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid #e2d3b0;border-radius:14px;padding:8px;margin-top:8px}
  .petCard.on{border-color:#ff9f1c;background:#fff2d6}
  .petCard canvas{flex:none;background:#f3ecdc;border-radius:10px}
  .petCard .info{flex:1;min-width:0;font-size:13px;line-height:1.5}
  .petCard .info b{font-size:15px}
  .xpb{height:8px;border-radius:4px;background:#eee;overflow:hidden}.xpb i{display:block;height:100%;background:#8be07b}
  /* 攀岩 */
  #cvClimb{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:2;touch-action:none}
  #ctlClimb{z-index:6}
  #ctlClimb .hud{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));background:rgba(10,14,26,.7);border-radius:14px;padding:8px 12px;color:#fff;font-weight:800;font-size:14px;pointer-events:none;min-width:200px}
  #ctlClimb .sbar{height:14px;border-radius:7px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:6px}
  #ctlClimb .sbar i{display:block;height:100%;background:#5bc46a;transition:width .2s}
  #clHint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:rgba(10,14,26,.7);color:#fff;font-weight:800;font-size:14px;padding:8px 14px;border-radius:14px;pointer-events:none;text-align:center;max-width:90vw}
  #clEnter{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));font-size:20px;padding:14px 26px}
  #clView{right:calc(118px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top))}
  #clPause{right:calc(66px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top))}
  #clRec{right:calc(14px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top))}
  #toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:50;pointer-events:none;
    background:rgba(20,24,36,.86);border:2px solid #ffd65c;color:#fff;padding:8px 16px;border-radius:14px;font-weight:800;font-size:16px;
    text-align:center;max-width:90vw;opacity:0;transition:opacity .25s}
  #toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- 樓層操作 -->
<div id="ctlFloor" class="layer hidden">
  <div id="joyZone"></div>
  <button class="btn" id="bAtk"><span class="em" id="atkEm">🌿</span>攻擊</button>
  <button class="btn" id="bSwap"><span class="em" id="swapEm">🔄</span><small>換武器</small></button>
  <button class="btn" id="bHeal"><span class="em">❤️</span><small id="healTxt">補血</small></button>
  <button class="btn" id="bId"><span class="em" id="idEm">🏹</span><small>身分</small></button>
  <button class="btn hidden" id="bRoll"><span class="em">🤸</span><small>翻滾</small></button>
  <button class="btn pz" id="bPause">⏸</button>
  <button class="btn pz" id="bRec">📜</button>
</div>

<!-- 開車操作 -->
<div id="ctlDrive" class="layer hidden">
  <button class="btn arrow" id="dL">◀</button>
  <button class="btn arrow" id="dR">▶</button>
  <button class="btn pz" id="bPause2">⏸</button>
  <button class="btn" id="bId2" style="width:58px;height:58px;right:calc(16px + env(safe-area-inset-right));top:calc(70px + env(safe-area-inset-top))"><span class="em" id="idEm2">🏹</span><small>身分</small></button>
</div>

<!-- 4 樓：村莊 -->
<div id="ctl4" class="layer hidden">
  <div id="joyZone4" style="position:absolute;left:0;top:70px;bottom:0;width:60%"></div>
  <button class="btn pz" id="v4Pet">🐾</button>
  <button class="btn pz" id="v4Pause">⏸</button>
  <button class="btn pz" id="v4Rec">📜</button>
  <button class="pill red act hidden" id="v4Act">打開</button>
</div>
<div id="bt4" class="hidden"></div>

<!-- 攀岩 -->
<canvas id="cvClimb"></canvas>
<div id="ctlClimb" class="layer hidden">
  <div class="hud"><div id="clFloor">🧗 1 樓高度</div><div class="sbar"><i id="clSta" style="width:100%"></i></div><div id="clStaT" style="font-size:12px;margin-top:3px">💪 體力 100</div></div>
  <button class="btn pz" id="clView">🎥</button>
  <button class="btn pz" id="clPause">⏸</button>
  <button class="btn pz" id="clRec">📜</button>
  <button class="pill red hidden" id="clEnter">🪟 進入 1 樓</button>
  <div id="clHint">拖手腳到抓點，可以無限伸長！拖到最上面會往上捲</div>
</div>

<!-- 3 樓操作 -->
<div id="ctl3" class="layer hidden">
  <button class="btn pz" id="b3Pause">⏸</button>
  <button class="btn pz" id="b3Rec">📜</button>
  <div class="k3" id="k3"></div>
</div>

<!-- 家裡 -->
<div id="ctlHome" class="layer hidden">
  <div id="homeBar">
    <button class="pill" id="hShop">🛒 玩具店</button>
    <button class="pill red" id="hRec">📜 紀錄</button>
    <button class="pill blue" id="hId">🧑 換身分</button>
    <button class="pill green hidden" id="hCall">📞 等任務電話</button>
  </div>
</div>

<div id="dialog" class="hidden"><div class="who" id="dlgWho"></div><div class="txt" id="dlgTxt"></div><div class="next">點一下繼續 ▶</div></div>
<div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>
<div id="toast"></div>

<!-- 2 樓畫畫比賽：畫圖畫面 -->
<div id="drawUI" class="hidden">
  <div class="dTop"><span id="dCount">第 1/10 張</span><span class="tp" id="dTopic">題目</span><span class="tm" id="dTimer">60</span>
    <button class="sz" id="dPauseBtn" style="width:44px">⏸</button></div>
  <div class="dMain"><canvas id="dCanvas" width="480" height="480"></canvas><div class="dRivals" id="dRivals"></div></div>
  <div class="dTools" id="dTools"></div>
  <div id="dGhost" class="hidden" style="position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #3a2f1c,0 6px 14px rgba(0,0,0,.35);pointer-events:none;z-index:60"></div>
  <div id="dPauseBox" class="hidden">⏸ 暫停中<div style="font-size:14px;font-weight:600;color:#7a6a4a">（時間和妖怪都停下來了）</div>
    <div class="row" style="display:flex;gap:10px"><button class="pill green" id="dResume">▶️ 繼續畫</button><button class="pill blue" id="dSaveHome">💾 存檔回家</button></div>
    <div style="font-size:13px;font-weight:600;color:#7a6a4a">存檔回家的話，這一張還沒畫完的圖不算，之前畫好的都會保存。</div></div>
</div>

<script src="three.min.js"></script>
<script>
'use strict';
/* =========================================================
   妖怪大樓救援隊
   家 → 開車 → 大樓 1F（附件平面圖）→ 打妖怪 / 變妖怪 → 秘密通道 → 回家買玩具
   ========================================================= */
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);}
addEventListener('resize',resize);resize();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,hyp=Math.hypot;
const EMO='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
function emo(e,x,y,s){ctx.font=s+'px '+EMO;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,x,y);}
function txt(s,x,y,size,col,align,weight){ctx.font=(weight||800)+' '+size+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(s,x,y);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------- 存檔 ---------- */

function addSeg(ax,ay,bx,by){walls.push({ax,ay,bx,by,x0:Math.min(ax,bx),x1:Math.max(ax,bx),y0:Math.min(ay,by),y1:Math.max(ay,by)});}
function segPt(px,py,w){const dx=w.bx-w.ax,dy=w.by-w.ay,l=dx*dx+dy*dy;let t=l?((px-w.ax)*dx+(py-w.ay)*dy)/l:0;t=t<0?0:t>1?1:t;const cx=w.ax+dx*t,cy=w.ay+dy*t;return[cx,cy,hyp(px-cx,py-cy),t];}
function addPoly(pts,doors){
  for(let i=0;i<pts.length;i++){
    const a=pts[i],b=pts[(i+1)%pts.length],w={ax:a[0],ay:a[1],bx:b[0],by:b[1]},L=hyp(b[0]-a[0],b[1]-a[1]);
    const cuts=[];
    (doors||[]).forEach(d=>{const r=segPt(d[0],d[1],w);if(r[2]<14){const h=d[2]/2/L;cuts.push([r[3]-h,r[3]+h]);}});
    cuts.sort((p,q)=>p[0]-q[0]);
    let t=0;
    for(const c of cuts){if(c[0]>t)addSeg(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[0]+(b[0]-a[0])*c[0],a[1]+(b[1]-a[1])*c[0]);t=Math.max(t,c[1]);}
    if(t<1)addSeg(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,b[0],b[1]);
  }
}

function pip(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function roomAt(x,y){for(let i=0;i<ROOMS.length;i++)if(pip(x,y,ROOMS[i].pts))return i;return null;}
function wallDist(x,y){let m=1e9;for(const w of walls){const d=segPt(x,y,w)[2];if(d<m)m=d;}return m;}
function rayT(ax,ay,bx,by){let best=1;const rx=bx-ax,ry=by-ay;
  for(const w of walls){const sx=w.bx-w.ax,sy=w.by-w.ay,d=rx*sy-ry*sx;if(!d)continue;
    const cx=w.ax-ax,cy=w.ay-ay,u=(cx*sy-cy*sx)/d,v=(cx*ry-cy*rx)/d;if(u>=0&&u<best&&v>=0&&v<=1)best=u;}
  return best;}
function los(ax,ay,bx,by){return rayT(ax,ay,bx,by)>=1;}
function collide(o){
  for(let k=0;k<2;k++)for(const w of walls){
    if(o.x<w.x0-o.r||o.x>w.x1+o.r||o.y<w.y0-o.r||o.y>w.y1+o.r)continue;
    const r=segPt(o.x,o.y,w);if(r[2]<o.r&&r[2]>1e-4){o.x=r[0]+(o.x-r[0])/r[2]*o.r;o.y=r[1]+(o.y-r[1])/r[2]*o.r;}
  }
}
function randInRoom(i,margin){const r=ROOMS[i];let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;r.pts.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});
  for(let k=0;k<400;k++){const x=rand(x0,x1),y=rand(y0,y1);if(pip(x,y,r.pts)&&wallDist(x,y)>margin)return[x,y];}return[r.cx,r.cy];}

/* 尋路格（BFS 流場） */
const CELL=25,GW=Math.ceil(2200/CELL),GH=Math.ceil(1400/CELL);
const blocked=new Uint8Array(GW*GH),fdist=new Int32Array(GW*GH),bq=new Int32Array(GW*GH);
for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const x=gx*CELL+CELL/2,y=gy*CELL+CELL/2;blocked[gy*GW+gx]=(!pip(x,y,OUT)||wallDist(x,y)<14)?1:0;}
function flow(tx,ty){
  fdist.fill(-1);let s=clamp(Math.floor(ty/CELL),0,GH-1)*GW+clamp(Math.floor(tx/CELL),0,GW-1);
  if(blocked[s]){const gx=s%GW,gy=(s/GW)|0;let f=-1;for(let r=1;r<3&&f<0;r++)for(let dy=-r;dy<=r&&f<0;dy++)for(let dx=-r;dx<=r;dx++){const nx=gx+dx,ny=gy+dy;if(nx>=0&&ny>=0&&nx<GW&&ny<GH&&!blocked[ny*GW+nx]){f=ny*GW+nx;break;}}if(f<0)return;s=f;}
  let h=0,t=0;bq[t++]=s;fdist[s]=0;
  while(h<t){const c=bq[h++],cx=c%GW,cy=(c/GW)|0,d=fdist[c]+1;
    if(cx>0){const n=c-1;if(!blocked[n]&&fdist[n]<0){fdist[n]=d;bq[t++]=n;}}
    if(cx<GW-1){const n=c+1;if(!blocked[n]&&fdist[n]<0){fdist[n]=d;bq[t++]=n;}}
    if(cy>0){const n=c-GW;if(!blocked[n]&&fdist[n]<0){fdist[n]=d;bq[t++]=n;}}
    if(cy<GH-1){const n=c+GW;if(!blocked[n]&&fdist[n]<0){fdist[n]=d;bq[t++]=n;}}}
}
function navDir(e){const gx=Math.floor(e.x/CELL),gy=Math.floor(e.y/CELL);let best=-1,bd=1e9;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=gx+dx,ny=gy+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;const n=ny*GW+nx;
    if(blocked[n]||fdist[n]<0)continue;const v=fdist[n]+(dx&&dy?.4:0);if(v<bd){bd=v;best=n;}}
  if(best<0){const dx=P.x-e.x,dy=P.y-e.y,l=hyp(dx,dy)||1;return[dx/l,dy/l];}
  const tx=(best%GW)*CELL+CELL/2,ty=((best/GW)|0)*CELL+CELL/2,dx=tx-e.x,dy=ty-e.y,l=hyp(dx,dy)||1;return[dx/l,dy/l];}

/* 主角畫法（家裡、開車、樓層共用）：three.js 立體模型，畫進 2D 畫面 */
const Hero3D=(function(){
  if(!window.THREE)return null;
  try{
    const S=224,R=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});
    R.setPixelRatio(1);R.setSize(S,S,false);R.setClearColor(0x000000,0);
    const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(28,1,.1,50);
    cam.position.set(0,4.6,7.4);cam.lookAt(0,1.15,0);
    sc.add(new THREE.HemisphereLight(0xffffff,0x6a5a48,.85));
    const sun=new THREE.DirectionalLight(0xffffff,.75);sun.position.set(3,6,5);sc.add(sun);
    const rim=new THREE.DirectionalLight(0xbfdcff,.35);rim.position.set(-4,3,-4);sc.add(rim);
    const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.05});
    const mesh=(g,c,x,y,z,par)=>{const m=new THREE.Mesh(g,M(c));m.position.set(x||0,y||0,z||0);(par||root).add(m);return m;};
    const root=new THREE.Group();sc.add(root);
    let built=-1,legL,legR,armL,armR,body;
    function limb(c,len,r){const g=new THREE.Group(),m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.9,len,12),M(c));m.position.y=-len/2;g.add(m);
      const tip=new THREE.Mesh(new THREE.SphereGeometry(r*1.15,12,10),M(c));tip.position.y=-len;g.add(tip);return g;}
    function build(i){
      while(root.children.length)root.remove(root.children[0]);
      const id=IDS[i],k=id.k;
      // 腿、鞋
      legL=limb('#3d4258',.62,.17);legL.position.set(-.24,.72,0);root.add(legL);
      legR=limb('#3d4258',.62,.17);legR.position.set(.24,.72,0);root.add(legR);
      [legL,legR].forEach(l=>{const sh=new THREE.Mesh(new THREE.BoxGeometry(.3,.16,.42),M('#2a2a30'));sh.position.set(0,-.66,.08);l.add(sh);});
      // 身體
      body=mesh(new THREE.SphereGeometry(.62,24,18),id.c,0,1.12,0);body.scale.set(1,1.08,.85);
      mesh(new THREE.CylinderGeometry(.5,.58,.18,20),'#3d4258',0,.74,0);           // 腰帶
      // 手
      armL=limb(id.c,.55,.14);armL.position.set(-.62,1.42,0);armL.rotation.z=-.35;root.add(armL);
      armR=limb(id.c,.55,.14);armR.position.set(.62,1.42,0);armR.rotation.z=.35;root.add(armR);
      [armL,armR].forEach(a=>{a.children[1].material=M('#ffd9b0');});
      // 頭
      const head=mesh(new THREE.SphereGeometry(.56,28,22),'#ffd9b0',0,2.08,0);
      mesh(new THREE.SphereGeometry(.085,10,8),'#222',-.19,2.12,.5);mesh(new THREE.SphereGeometry(.085,10,8),'#222',.19,2.12,.5);
      mesh(new THREE.SphereGeometry(.03,6,6),'#fff',-.17,2.15,.58);mesh(new THREE.SphereGeometry(.03,6,6),'#fff',.21,2.15,.58);
      const ck1=mesh(new THREE.SphereGeometry(.08,10,8),'#ff9aa8',-.32,1.98,.42),ck2=mesh(new THREE.SphereGeometry(.08,10,8),'#ff9aa8',.32,1.98,.42);ck1.scale.z=ck2.scale.z=.4;
      const mouth=mesh(new THREE.TorusGeometry(.09,.022,6,12,Math.PI),'#a33',0,1.94,.52);mouth.rotation.z=Math.PI;
      // 帽子
      const cap=mesh(new THREE.SphereGeometry(.58,26,16,0,Math.PI*2,0,Math.PI/2),id.hat,0,2.16,0);cap.scale.y=.75;
      if(k==='racer'){cap.scale.set(1.08,1.15,1.08);const vis=mesh(new THREE.BoxGeometry(.7,.16,.12),'#7fd3ff',0,2.22,.55);vis.material.metalness=.5;}
      else if(k==='nurse'){cap.scale.y=.55;mesh(new THREE.BoxGeometry(.08,.26,.05),'#e8483a',0,2.5,.4);mesh(new THREE.BoxGeometry(.26,.08,.05),'#e8483a',0,2.5,.4);}
      else{const brim=mesh(new THREE.CylinderGeometry(.42,.42,.05,20,1,false,-Math.PI/2,Math.PI),id.hat,0,2.17,.22);brim.scale.z=1.1;}
      if(k==='police')mesh(new THREE.SphereGeometry(.09,10,8),'#ffd65c',0,2.42,.42);
      if(k==='hunter'){const f=mesh(new THREE.ConeGeometry(.06,.5,8),'#e8483a',.4,2.55,-.05);f.rotation.z=-.6;}
      if(k==='kid'){mesh(new THREE.BoxGeometry(.7,.75,.32),id.hat,0,1.18,-.52);}
      if(k==='mail'){const bag=mesh(new THREE.BoxGeometry(.32,.38,.2),'#8a5a30',.62,1.0,.18);bag.rotation.z=.2;}
      if(k==='stunt')mesh(new THREE.OctahedronGeometry(.16),'#ffd65c',0,1.2,.55);
      if(k==='police'){const b=mesh(new THREE.BoxGeometry(.14,.16,.04),'#ffd65c',-.25,1.36,.5);}
      built=i;
    }
    // 每個方向／步伐只算一次 3D，之後直接貼圖（手機也順）
    const DIRS=16,STEPS=8,cache=new Map();
    function frame(a,st){
      const key=P.id+'|'+a+'|'+st;let c=cache.get(key);if(c)return c;
      if(built!==P.id)build(P.id);
      root.rotation.y=a/DIRS*Math.PI*2;
      const ph=st/STEPS*Math.PI*2,sw=st<0?0:Math.sin(ph)*.6;
      legL.rotation.x=sw;legR.rotation.x=-sw;armL.rotation.x=-sw*.8;armR.rotation.x=sw*.8;
      root.position.y=st<0?0:Math.abs(Math.sin(ph))*.08;
      R.render(sc,cam);
      c=document.createElement('canvas');c.width=c.height=S;c.getContext('2d').drawImage(R.domElement,0,0);
      if(cache.size>700)cache.clear();
      cache.set(key,c);return c;
    }
    return{
      draw(x,y,size,ang,walk,t){
        const a=((Math.round(ang/(Math.PI*2)*DIRS)%DIRS)+DIRS)%DIRS;
        const st=walk?Math.floor(t*12/(Math.PI*2)*STEPS)%STEPS:-1;
        const bob=walk?0:Math.sin(t*2.4)*size*.012;
        ctx.drawImage(frame(a,st),x-size/2,y-size*.8+bob,size,size);
      }
    };
  }catch(e){console.warn('3D 主角無法使用，改用平面版',e);return null;}
})();
function drawHero(x,y,sc,tilt,dir,ang,walk){
  const id=IDS[P.id],r=14*sc;
  ctx.save();ctx.translate(x,y);ctx.rotate(tilt||0);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,r*.9,r,r*.35,0,0,7);ctx.fill();
  if(Hero3D){
    if(ang===undefined)ang=dir>0?.55:dir<0?-.55:0;
    Hero3D.draw(0,r*.9,r*4.4,ang,walk,T);
    emo(id.e,r*.95,r*.5,r*.7);
    ctx.restore();return;
  }
  ctx.fillStyle=id.c;ctx.beginPath();ctx.arc(0,r*.25,r,0,7);ctx.fill();
  ctx.fillStyle='#ffd9b0';ctx.beginPath();ctx.arc(0,-r*.55,r*.72,0,7);ctx.fill();
  ctx.fillStyle=id.hat;ctx.beginPath();ctx.arc(0,-r*.7,r*.74,Math.PI,0);ctx.fill();ctx.fillRect(dir<0?-r*1.05:0,-r*.78,r*1.05,r*.16);
  if(id.k==='nurse'){ctx.fillStyle='#e8483a';ctx.fillRect(-r*.12,-r*1.25,r*.24,r*.5);ctx.fillRect(-r*.25,-r*1.12,r*.5,r*.24);}
  if(id.k==='police'){ctx.fillStyle='#ffd65c';ctx.beginPath();ctx.arc(0,-r*1.0,r*.14,0,7);ctx.fill();}
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-r*.25+dir*r*.12,-r*.5,r*.09,0,7);ctx.arc(r*.25+dir*r*.12,-r*.5,r*.09,0,7);ctx.fill();
  emo(id.e,r*.55,r*.45,r*.85);
  ctx.restore();
}

const drive={};
function startDrive(){
  scene='drive';setLayers();
  Object.assign(drive,{dist:0,len:6500,lane:1,x:0,objs:[],slow:0,done:0,spawnD:500,coins:0,crash:0});
  toast(idk()==='racer'?'🏎️ 賽車手開車特別快！閃開路上的車子！':'🚗 開往城市最高樓！閃開路上的車子，順便撿金幣',2600);
}
function laneX(l){const rw=Math.min(W*.62,330);return W/2-rw/2+rw*(l+.5)/3;}
function updDrive(dt){
  const sp=(idk()==='racer'?440:340)*(drive.slow>0?.4:1);
  drive.slow-=dt;drive.crash-=dt;
  if(!drive.done){drive.dist+=sp*dt;}
  const tx=laneX(drive.lane);if(!drive.x)drive.x=tx;drive.x+=(tx-drive.x)*Math.min(1,dt*12);
  while(drive.spawnD<drive.dist+H+200&&drive.spawnD<drive.len-300){
    drive.spawnD+=rand(220,380);
    const l=Math.floor(rand(0,3));
    if(Math.random()<.7)drive.objs.push({t:'car',l,d:drive.spawnD,c:pick(['#e85d4a','#4a8be8','#f2c84b','#5bc46a','#b06ad8','#ffffff'])});
    const l2=(l+1+Math.floor(rand(0,2)))%3;for(let k=0;k<3;k++)drive.objs.push({t:'coin',l:l2,d:drive.spawnD+k*40});
  }
  const py=H*.78;
  for(const o of drive.objs){if(o.t==='car')o.d+=130*dt;
    const sy=py-(o.d-drive.dist);
    if(Math.abs(sy-py)<(o.t==='car'?58:30)&&Math.abs(laneX(o.l)-drive.x)<(o.t==='car'?44:34)&&!o.hit){
      o.hit=1;if(o.t==='car'){drive.slow=1;drive.crash=.4;shake=10;sfx(90,.3,'sawtooth',.08,-40);toast('砰！小心開車！',1000);}
      else{save.money++;drive.coins++;persist();sfx(1300,.06,'square',.03,300);}}
  }
  drive.objs=drive.objs.filter(o=>!(o.t==='coin'&&o.hit)&&o.d>drive.dist-200);
  if(drive.dist>=drive.len&&!drive.done){drive.done=T;toast('🏢 到了！準備從外牆爬上去',1600);sfx(660,.3,'triangle',.06,300);}
  if(drive.done&&T-drive.done>1.8&&!drive.elev){drive.elev=1;startClimb();}
}

}

function chase(e,sp,dt){let mx,my;if(e.seen){mx=P.x-e.x;my=P.y-e.y;const l=hyp(mx,my)||1;mx/=l;my/=l;}else[mx,my]=navDir(e);e.x+=mx*sp*dt;e.y+=my*sp*dt;collide(e);}

function wander(e,dt,sp){

  const nx=e.x+e.wdx*sp*dt,ny=e.y+e.wdy*sp*dt;
  if(e.room!=null&&!pip(nx,ny,ROOMS[e.room].pts)){e.wdx*=-1;e.wdy*=-1;return;}
  e.x=nx;e.y=ny;collide(e);if(e.wdx)e.face=e.wdx<0?-1:1;
}
function lobAt(kind,e,tx,ty,T){lobs.push({kind,sx:e.x,sy:e.y,tx,ty,t:0,T});}
function updEnemy(e,dt){

  const sp=e.spd*(e.frozen>0?.35:1),dx=P.x-e.x,dy=P.y-e.y,d=hyp(dx,dy)||1;
  e.losT-=dt;if(e.losT<=0){e.losT=.18+Math.random()*.1;e.seen=d<620&&los(e.x,e.y,P.x,P.y);}
  if(!isHostile(e)){wander(e,dt,sp*.55);return;}
  if(!e.aggro){if((e.seen&&d<300)||e.kind==='human')e.aggro=true;else{wander(e,dt,sp*.5);return;}}
  if(e.wind<=0)e.face=dx<0?-1:1;
  const pr=e.r+P.r;
  switch(e.kind){
    case'zombie':
      if(!e.seen||d>230)chase(e,sp,dt);else if(d<140)away(e,sp*.6,dt);
      if(e.seen&&d<420&&e.cd<=0){bullets.push({x:e.x+dx/d*14,y:e.y+dy/d*14-4,vx:dx/d*250,vy:dy/d*250,dmg:8,own:'e',life:2,r:6,col:'#e8f5c8',tooth:1});e.cd=1.6;sfx(240,.05,'square',.02);}
      break;
    case'slime':

      else{if(d>pr+16)chase(e,sp,dt);if(d<pr+30&&e.cd<=0&&e.seen)e.wind=.5;}
      break;
    case'banana':
      if(!e.seen||d>270)chase(e,sp,dt);else if(d<170)away(e,sp,dt);
      if(e.seen&&d<360&&e.cd<=0){lobAt('bomb',e,P.x+rand(-10,10),P.y+rand(-10,10),.8);e.cd=2.4;}
      break;
    case'boss':bossAI(e,dt,d,dx,dy,sp,pr);break;

      break;
  }
}

  if(K.KeyA||K.ArrowLeft)mx--;if(K.KeyD||K.ArrowRight)mx++;if(K.KeyW||K.ArrowUp)my--;if(K.KeyS||K.ArrowDown)my++;
  if(joy.active){const jx=joy.x-joy.bx,jy=joy.y-joy.by,l=hyp(jx,jy);if(l>8){const m=Math.min(1,l/55);mx+=jx/l*m;my+=jy/l*m;}}
  const ml=hyp(mx,my);if(ml>1){mx/=ml;my/=ml;}
  let sp=mode==='monster'?175:(k==='racer'?220:160);if(P.slow>0)sp*=.55;
  if(P.roll>0){P.roll-=dt;P.x+=P.rdx*430*dt;P.y+=P.rdy*430*dt;}else{P.x+=mx*sp*dt;P.y+=my*sp*dt;}
  collide(P);
  P.moving=ml>.1;if(P.moving&&!(input.atk&&P.cd>0)){P.fx=mx/Math.max(ml,1e-3);P.fy=my/Math.max(ml,1e-3);const l=hyp(P.fx,P.fy)||1;P.fx/=l;P.fy/=l;}
  if(!trail.length||hyp(P.x-trail[0].x,P.y-trail[0].y)>6){trail.unshift({x:P.x,y:P.y});if(trail.length>500)trail.pop();}
  if(input.atk||K.KeyJ||K.Space)tryAttack();
  // 跟班
  followers.forEach((f,i)=>{const tp=trail[Math.min(trail.length-1,(i+1)*5)]||P;f.x+=(tp.x-f.x)*Math.min(1,dt*8);f.y+=(tp.y-f.y)*Math.min(1,dt*8);});
  // 流場
  flowT-=dt;if(flowT<=0){flowT=.3;flow(P.x,P.y);}
  // 敵人
  for(const e of enemies)if(!e.dead)updEnemy(e,dt);
  for(let i=0;i<enemies.length;i++){const a=enemies[i];if(a.dead)continue;for(let j=i+1;j<enemies.length;j++){const b=enemies[j];if(b.dead)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=hyp(dx,dy),m=a.r+b.r;if(d<m&&d>0){const p=(m-d)/2;a.x-=dx/d*p;a.y-=dy/d*p;b.x+=dx/d*p;b.y+=dy/d*p;}}}
  // 子彈
  for(const b of bullets){
    if(b.kind==='boomer'){b.t+=dt;b.rot+=dt*18;if(b.t>b.T/2){const dx=P.x-b.x,dy=P.y-b.y,l=hyp(dx,dy)||1;b.vx=dx/l*b.sp;b.vy=dy/l*b.sp;if(l<20)b.life=0;}}
    const nx=b.x+b.vx*dt,ny=b.y+b.vy*dt;
    if(b.kind!=='boomer'&&!los(b.x,b.y,nx,ny)){b.life=0;burst(b.x,b.y,b.col,4);continue;}
    b.x=nx;b.y=ny;b.life-=dt;
    if(b.own==='p'){for(const e of enemies){if(e.dead||!isHostile(e))continue;if(hyp(e.x-b.x,e.y-b.y)<e.r+b.r){
        if(b.kind==='boomer'){const last=b.hits.get(e)||-9;if(T-last<.35)continue;b.hits.set(e,T);hurtEnemy(e,b.dmg,b.vx/b.sp,b.vy/b.sp);}
        else{const l=hyp(b.vx,b.vy)||1;hurtEnemy(e,b.dmg,b.vx/l,b.vy/l);if(b.freeze)e.frozen=1.6;b.life=0;break;}}}}
    else if(hyp(P.x-b.x,P.y-b.y)<P.r+b.r){hurtPlayer(b.dmg);b.life=0;}
  }
  bullets=bullets.filter(b=>b.life>0);
  // 拋物
  for(const l of lobs){l.t+=dt;if(l.t>=l.T){l.done=1;
    if(l.kind==='grenade'){booms.push({x:l.tx,y:l.ty,r:l.rad,t:.35});shake=9;sfx(90,.35,'sawtooth',.08,-50);
      for(const e of enemies){if(!e.dead&&isHostile(e)&&hyp(e.x-l.tx,e.y-l.ty)<l.rad+e.r){const dx=e.x-l.tx,dy=e.y-l.ty,d=hyp(dx,dy)||1;hurtEnemy(e,l.dmg,dx/d*2,dy/d*2);}}}
    else if(l.kind==='bomb')fuses.push({x:l.tx,y:l.ty,t:1.0,r:66});
    else if(l.kind==='goo'){puddles.push({x:l.tx,y:l.ty,r:16,max:rand(80,100),life:13});sfx(160,.12,'sine',.04,-60);}}}
  lobs=lobs.filter(l=>!l.done);
  for(const f of fuses){f.t-=dt;if(f.t<=0){booms.push({x:f.x,y:f.y,r:f.r,t:.35});shake=8;sfx(80,.3,'sawtooth',.07,-40);if(hyp(P.x-f.x,P.y-f.y)<f.r+P.r)hurtPlayer(18);}}
  fuses=fuses.filter(f=>f.t>0);
  // 黏液
  let inGoo=false;
  for(const p of puddles){p.life-=dt;if(p.r<p.max)p.r+=7*dt;if(p.life<2)p.r-=20*dt;if(mode==='human'&&hyp(P.x-p.x,P.y-p.y)<p.r+P.r*.4)inGoo=true;}
  puddles=puddles.filter(p=>p.life>0&&p.r>4);
  if(inGoo){P.slow=.15;P.gooTick-=dt;if(P.gooTick<=0&&P.roll<=0){P.gooTick=.35;const gd=Math.round(4*FS.dmg);P.hp-=gd;floatT(P.x,P.y-28,'-'+gd+' 黏黏！','#9be37a',14);if(P.hp<=0)onZero();}}
  // 物品
  for(const it of items){it.t+=dt;it.lock-=dt;const d=hyp(P.x-it.x,P.y-it.y);
    if(it.kind==='coin'){if(d<90){it.x+=(P.x-it.x)*Math.min(1,dt*8);it.y+=(P.y-it.y)*Math.min(1,dt*8);}
      if(d<P.r+10){it.done=1;save.money+=it.v;runCoins+=it.v;persist();floatT(it.x,it.y-12,'💰+'+it.v,'#ffd65c',14);sfx(1300,.05,'square',.025,300);}}
    else if(it.lock<=0&&d<P.r+16&&mode==='human'){it.done=pickWeapon(it);}}
  items=items.filter(i=>!i.done);
  // AED
  if(!AED.used&&mode==='human'&&hyp(P.x-AED.x,P.y-AED.y)<34&&P.hp<P.max){AED.used=true;P.hp=P.max;burst(P.x,P.y,'#ffe066',20);toast('⚡ AED 急救！血補滿了！');sfx(500,.4,'sine',.06,600);}
  // 變妖怪模式

      if(invSpawned===1)toast('🧑‍💼 人類從電梯衝進來了！');}
    if(invSpawned>=invTotal&&!enemies.some(e=>!e.dead&&e.kind==='human'))becomeHuman();
  }
  // 房間清空、秘密通道
  checkT-=dt;if(checkT<=0){checkT=.4;
    ROOMS.forEach((r,i)=>{r.clear=!enemies.some(e=>!e.dead&&e.kind!=='human'&&pip(e.x,e.y,r.pts));});
    if(mode==='human'&&!passage.shown&&ROOMS[passage.room].clear&&!passage.boss)spawnBoss();
    if(passage.boss===1&&!enemies.some(e=>!e.dead&&e.kind==='boss')&&mode==='human'){passage.boss=2;passage.shown=true;toast(`✨ 魔王倒下了！${ROOMS[passage.room].name}的秘密通道打開了`,3000);sfx(1000,.4,'sine',.05,800);}
    refreshButtons();}
  if(passage.shown&&mode==='human'&&hyp(P.x-passage.x,P.y-passage.y)<P.r+22){floorComplete();return;}
  enemies=enemies.filter(e=>!e.dead);
  // 特效
  for(const p of parts){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;}parts=parts.filter(p=>p.t>0);
  for(const f of floats){f.t-=dt;f.y-=30*dt;}floats=floats.filter(f=>f.t>0);
  for(const s of swings)s.t-=dt;swings=swings.filter(s=>s.t>0);
  for(const b of beams)b.t-=dt;beams=beams.filter(b=>b.t>0);
  for(const b of booms)b.t-=dt;booms=booms.filter(b=>b.t>0);
}

/* ---------- 魔王：守在秘密通道前 ---------- */
function spawnBoss(){
  passage.boss=1;const e=makeEnemy('boss',passage.x,passage.y,passage.room);e.aggro=true;e.cd=1.5;e.pat=0;e.touch=0;enemies.push(e);
  shake=16;sfx(70,1,'sawtooth',.1,30);burst(passage.x,passage.y,'#a35cff',40);
  toast(`👹 ${ROOMS[passage.room].name}的秘密通道前跳出了<b>妖怪大王</b>！打倒牠才能進通道`,3400);
  logRec(`👹 ${curFloor} 樓的妖怪大王出現了`);
}
function bossAI(e,dt,d,dx,dy,sp,pr){
  const rage=e.hp<e.max*.5;e.touch-=dt;
  if(e.windB>0){e.windB-=dt;if(e.windB<=0){e.charge=.6;e.hitC=0;sfx(200,.3,'sawtooth',.08,-120);}return;}
  if(e.charge>0){e.charge-=dt;e.x+=e.cdx*(rage?420:340)*dt;e.y+=e.cdy*(rage?420:340)*dt;collide(e);
    if(!e.hitC&&d<pr+8){e.hitC=1;hurtPlayer(22);shake=12;}return;}
  chase(e,sp*(rage?1.25:1),dt);
  if(d<pr+4&&e.touch<=0){e.touch=.8;hurtPlayer(14);}
  if(e.cd>0)return;
  const pat=e.pat++%3;
  if(pat===0){const n=rage?16:12,o=rand(0,1);for(let i=0;i<n;i++){const a=o+i/n*Math.PI*2;bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*220,vy:Math.sin(a)*220,dmg:9,own:'e',life:2.4,r:8,col:'#c06bff'});}
    sfx(150,.3,'square',.06,-60);e.cd=rage?1.3:1.9;}
  else if(pat===1){e.cdx=dx/d;e.cdy=dy/d;e.windB=rage?.35:.55;e.cd=rage?1.4:2;}
  else{for(let i=0;i<(rage?3:2);i++){const a=rand(0,6.28),m=makeEnemy(pick(MONSTER_KINDS),e.x+Math.cos(a)*60,e.y+Math.sin(a)*60,e.room);m.aggro=true;collide(m);enemies.push(m);}
    floatT(e.x,e.y-e.r-20,'出來吧，小妖怪們！','#d9b3ff',15);sfx(300,.4,'sine',.05,-200);e.cd=rage?1.6:2.4;}
}
function bossDown(e){
  e.dead=true;burst(e.x,e.y,'#ffe66d',50);burst(e.x,e.y,'#a35cff',40);shake=20;sfx(660,.6,'triangle',.08,400);
  stat('bosses');logRec(`🏆 打倒 ${curFloor} 樓的妖怪大王！`);
  for(let i=0;i<10;i++)items.push({kind:'coin',v:Math.floor(rand(3,8)),x:e.x+rand(-40,40),y:e.y+rand(-40,40),t:0,lock:0});
  P.hp=Math.min(P.max,P.hp+30);floatT(P.x,P.y-30,'+30 ❤️','#ff8fb1',17);
  floatT(e.x,e.y-50,'妖怪大王變回了大樓管理員！','#bff7c3',16);
}

/* ---------- 樓層繪圖 ---------- */
function polyPath(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();}
function drawEnemy(e){
  const bob=Math.sin(T*6+e.bob)*2,x=e.x,y=e.y+bob,hostile=isHostile(e);
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*.8,e.r,e.r*.35,0,0,7);ctx.fill();
  if(e.kind==='slime'){const w=1+Math.sin(T*5+e.bob)*.08;ctx.fillStyle='#62cc45';ctx.beginPath();ctx.ellipse(x,y+2,e.r*w*1.1,e.r/w*.9,0,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(x-6,y-5,5,3,-.5,0,7);ctx.fill();
    ctx.fillStyle='#173d10';ctx.beginPath();ctx.arc(x-5+e.face*2,y,2.6,0,7);ctx.arc(x+5+e.face*2,y,2.6,0,7);ctx.fill();}
  else if(e.kind==='human'){ctx.fillStyle='#3d5a8a';ctx.beginPath();ctx.arc(x,y+3,e.r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x-3,y-2,6,12);ctx.fillStyle='#d33';ctx.fillRect(x-1.5,y,3,9);emo('😠',x,y-8,20);}
  else if(e.kind==='boss'){const rage=e.hp<e.max*.5;ctx.fillStyle=rage?'rgba(255,40,40,.28)':'rgba(160,60,255,.25)';ctx.beginPath();ctx.arc(x,y,e.r+10+Math.sin(T*6)*4,0,7);ctx.fill();
    ctx.save();ctx.translate(x,y);ctx.scale(-e.face,1);emo('👹',0,0,e.r*2.4);ctx.restore();emo('👑',x,y-e.r-8,26);
    if(e.windB>0){txt('!!',x,y-e.r-34,26,'#ff3b3b');ctx.strokeStyle='rgba(255,60,60,.7)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+e.cdx*260,y+e.cdy*260);ctx.stroke();}}
  else{ctx.save();ctx.translate(x,y);ctx.scale(-e.face,1);if(e.kind==='snake'&&e.stab>0)ctx.rotate(.5);emo(ETYPE[e.kind].e,0,0,e.r*2.3);ctx.restore();
    if(e.kind==='banana'){ctx.fillStyle='#a3241b';ctx.fillRect(x-7,y-6,5,2);ctx.fillRect(x+2,y-6,5,2);}}
  if(e.flash>0){ctx.globalAlpha=.6;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,e.r,0,7);ctx.fill();ctx.globalAlpha=1;}
  if(e.frozen>0){ctx.strokeStyle='#8fe3ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,e.r+4,0,7);ctx.stroke();}
  if(e.wind>0){txt('!',x,y-e.r-14,22,'#ff3b3b');ctx.strokeStyle='rgba(255,60,60,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+P.r+38,0,7);ctx.stroke();}
  if(!hostile&&mode==='monster'&&e.kind!=='human')emo('💜',x+e.r*.8,y-e.r*.8,11);
  if(e.hp<e.max&&hostile){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(x-16,y-e.r-10,32,5);ctx.fillStyle='#ff5050';ctx.fillRect(x-16,y-e.r-10,32*Math.max(0,e.hp/e.max),5);}
}
function drawFloor(){
  const z=cam.z=clamp(Math.min(W,H)/440,.62,1.5);
  cam.x+=(P.x-W/2/z-cam.x)*.18;cam.y+=(P.y-H/2/z-cam.y)*.18;

    emo(f.hp>0?f.face:'😵',f.x,f.y-5,18);if(f.weapon)emo(WEAPONS[f.weapon].e,f.x+10,f.y+6,13);
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(f.x-11,f.y-19,22,3);ctx.fillStyle='#ff8fb1';ctx.fillRect(f.x-11,f.y-19,22*f.hp/f.max,3);}
  // 敵人

      if(P.fy<-.5)wpn();   // 往上走時武器在身體後面

      if(P.fy>=-.5)wpn();}}

function hexMix(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16),m=(s)=>Math.round(((A>>s)&255)*(1-t)+((B>>s)&255)*t);return'#'+((1<<24)|(m(16)<<16)|(m(8)<<8)|m(0)).toString(16).slice(1);}
function rivalDrawing(ri,topic){
  const rv=RIVALS[ri],pen=mkPen();TOPICS[topic].d(pen);
  pen.st.forEach(s=>{if(Math.random()<.35)s.col=hexMix(s.col,rv.col,.55);});
  const extras=Math.floor(rand(0,5));
  for(let k=0;k<extras;k++){const key=Math.random()<.5?rv.fav:pick(EXTRA_KEYS);
    const sp=[[rand(.08,.25),rand(.08,.92)],[rand(.75,.92),rand(.08,.92)],[rand(.1,.9),rand(.06,.16)],[rand(.1,.9),rand(.86,.94)]][k%4];
    EXTRAS[key](pen,sp[0],sp[1],rand(.05,.08),pick(BRIGHT));}
  pen.st.forEach(s=>{const ox=rand(-1,1)*rv.wob*1.5,oy=rand(-1,1)*rv.wob*1.5;s.pts=s.pts.map(([x,y])=>[x+ox+rand(-1,1)*rv.wob,y+oy+rand(-1,1)*rv.wob]);});
  const colors=new Set(pen.st.map(s=>s.col)).size;
  return{st:pen.st,q:clamp(.26+extras*.12+Math.min(colors,7)*.025+rand(-.08,.12),.12,.97),dur:rand(.55,.92)};
}
function renderStrokes(c,st,size,frac){
  c.fillStyle='#fff';c.fillRect(0,0,size,size);c.lineCap='round';c.lineJoin='round';
  const n=st.length*clamp(frac,0,1);
  for(let i=0;i<st.length&&i<n;i++){const s=st[i],part=Math.min(1,n-i),k=Math.max(2,Math.ceil(s.pts.length*part));
    c.beginPath();for(let j=0;j<k;j++){const q=s.pts[j];j?c.lineTo(q[0]*size,q[1]*size):c.moveTo(q[0]*size,q[1]*size);}
    if(s.closed&&part>=1)c.closePath();
    if(s.fill&&part>=1){c.fillStyle=s.col;c.fill();c.strokeStyle=hexMix(s.col,'#000000',.35);c.lineWidth=Math.max(1,size/160);c.stroke();}
    else{c.strokeStyle=s.col;c.lineWidth=s.w*size/220;c.stroke();}}
}
function strokesURL(st){const c=document.createElement('canvas');c.width=c.height=200;renderStrokes(c.getContext('2d'),st,200,1);return c.toDataURL('image/jpeg',.7);}

  h+=`</div><p id="vMsg" style="min-height:44px;font-size:14px"></p><div class="row" id="vRow"></div>`;
  showModal(h);
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>castVote(+b.dataset.v));
}
function castVote(myPick){
  const c=c2(),v=c.vote,r=c.rounds[v.i],A=AUTH();
  if(v.lock===v.i)return;v.lock=v.i;
  const votes=[[0,myPick]];
  RIVALS.forEach((rv,j)=>{const me=j+1;let best=-1,bv=-9;
    for(let k=0;k<5;k++){if(k===me)continue;const val=r.q[k]+rand(0,.3);if(val>bv){bv=val;best=k;}}
    votes.push([me,best]);});
  const got=[0,0,0,0,0];votes.forEach(([,to])=>{got[to]++;v.score[to]++;});
  document.querySelectorAll('[data-v]').forEach(b=>{b.disabled=true;const k=+b.dataset.v;if(k===myPick)b.classList.add('pick');
    $('vt'+k).textContent=votes.filter(x=>x[1]===k).map(x=>A[x[0]].e).join('');
    if(got[k]){const s=document.createElement('span');s.className='plus';s.textContent='+'+got[k];b.appendChild(s);}});
  const j=Math.floor(rand(0,4)),rv=RIVALS[j],to=votes[j+1][1];
  $('vMsg').innerHTML=`${rv.e} <b>${rv.n}</b>：「我投給 ${A[to].e} ${A[to].n}！${pick(rv.say)}」`;
  sfx(880,.1,'triangle',.05,300);
  v.i++;persist();
  const last=v.i>=ROUNDS;
  $('vRow').innerHTML=`<button class="pill ${last?'red':'green'}" id="vNext">${last?'🏆 看結果！':'下一題 ▶'}</button>`;
  $('vNext').onclick=()=>{if(last)voteResult();else voteRound();};
}
function voteResult(){
  const c=c2(),sc=c.vote.score,A=AUTH(),mx=Math.max(...sc),order=[0,1,2,3,4].sort((a,b)=>sc[b]-sc[a]);
  const win=sc[0]===mx,tie=sc.filter(x=>x===mx).length>1;
  stat('contests');if(win)stat('contestWins');save.st.bestVotes=Math.max(save.st.bestVotes||0,sc[0]);
  logRec(win?`🎨 畫畫比賽${tie?'平手':'第一名'}！拿到 ${sc[0]} 分`:`🎨 畫畫比賽輸了（${sc[0]} 分，最高 ${mx} 分）`);
  const pics=c.rounds.map(r=>r.imgs[0]);save.st.lastPics=pics;
  let h=`<h2>${win?'🏆 你贏了！':'🥈 這次沒有贏……'}</h2>`;
  order.forEach((k,i)=>{h+=`<div class="rank ${sc[k]===mx?'win':''}"><span style="width:28px">${sc[k]===mx?'👑':i+1}</span><span style="width:120px">${A[k].e} ${A[k].n}</span><span class="bar"><i style="width:${mx?sc[k]/mx*100:0}%"></i></span><span>${sc[k]} 分</span></div>`;});
  if(win){
    const prize=tie?20:40;save.money+=prize;save.c2=null;persist();
    sfx(523,.2,'triangle',.06);setTimeout(()=>sfx(659,.2,'triangle',.06),150);setTimeout(()=>sfx(784,.3,'triangle',.06),300);
    hideModal();scene='result';
    clearFloor(`${h}<p>${tie?'平手也算贏家！':'你是畫畫冠軍！'}獎金 <b>💰 ${prize}</b> 元，樓梯打開了！</p>`);
  }else{
    // 沒贏也可以過關：畫完 10 張、投完票就算完成比賽
    const prize=10;save.money+=prize;save.c2=null;persist();
    hideModal();scene='result';
    clearFloor(`${h}<p>最高分是 ${mx} 分，你拿到 ${sc[0]} 分。多用幾種顏色、畫大一點、加一些好玩的東西，妖怪會比較喜歡喔！</p>
     <p>沒有拿第一也沒關係，你完成了比賽！參加獎 <b>💰 ${prize}</b> 元，樓梯一樣打開了。</p>`);
  }
}

/* ---------- 開始一場表演 ---------- */
function startShow(){
  const st=stage3();if(st==='none')return;
  b3.t=0;b3.fx=[];b3.claps=[];
  if(st==='stunt'){
    const list=[...TRICKS].sort(()=>Math.random()-.5).slice(0,5);
    Object.assign(b3,{ph:'stunt',tricks:list,ti:0,miss:0,seq:null,gap:1.2,anim:0});
    toast('🤹 照順序按箭頭！錯 3 次妖怪就會生氣',2200);
  }else if(st==='drum'){
    Object.assign(b3,{ph:'drum',ri:0,rounds:4,seq:null,gap:1.2,scores:[],anim:0,
      rivals:PERFORMERS.map(p=>({...p,score:Math.round(rand(58,90))}))});
    toast('🥁 打鼓比賽！照順序按鼓，打得又快又準',2200);
  }else{
    Object.assign(b3,{ph:'uni',ang:rand(-.05,.05),vel:0,wind:0,hold:0,left:UNI_TIME});
    toast(`🛞 按住左右保持平衡 ${UNI_TIME} 秒！`,2200);
  }
  set3Keys();sfx(660,.12,'triangle',.05,300);
}
function newSeq(len,keys,time){b3.seq={k:[...Array(len)].map(()=>Math.floor(rand(0,keys))),i:0,t:time,T:time};}
function key3(k){
  if(b3.ph==='chase'){b3.lane=clamp(b3.lane+(k?1:-1),0,2);sfx(400,.04,'triangle',.03);return;}
  const q=b3.seq;if(!q||b3.gap>0)return;
  if(q.k[q.i]===k){q.i++;sfx(b3.ph==='drum'?[180,240,900][k]:520+q.i*60,.08,b3.ph==='drum'&&k===2?'square':'triangle',.06);
    if(b3.ph==='drum')b3.fx.push({e:k<2?'🥁':'💥',x:k===0?-40:k===1?40:0,t:.4});
    if(q.i>=q.k.length)seqDone(true);}
  else{sfx(120,.2,'sawtooth',.06,-40);shake=6;seqDone(false);}
}
function seqDone(ok){
  const q=b3.seq;
  if(b3.ph==='stunt'){
    const tr=b3.tricks[b3.ti];
    if(ok){b3.anim=1.4;b3.claps=[0,1,2,3].map(i=>({i,t:1.4}));floatT3(`✨ ${tr[0]}成功！`,'#ffe066');sfx(784,.15,'triangle',.06,300);}
    else{b3.miss++;floatT3(b3.miss>=2?'😠 妖怪們開始生氣了……':'😬 出錯了！','#ff8a7a');}
    b3.ti++;b3.seq=null;b3.gap=1.3;
  }else{
    const part=q.i/q.k.length,speed=ok?q.t/q.T:0;b3.scores.push(Math.min(1,part)*80+speed*25);
    floatT3(ok?(speed>.4?'🔥 超快！':'👍 打好了'):'💦 打錯了','#ffe066');
    b3.ri++;b3.seq=null;b3.gap=1.1;
  }
}
const f3txt=[];function floatT3(s,col){f3txt.push({s,col,t:1.4});}

/* ---------- 每一幀 ---------- */
function upd3(dt){
  b3.t+=dt;
  for(const f of f3txt)f.t-=dt;while(f3txt.length&&f3txt[0].t<=0)f3txt.shift();
  for(const c of b3.claps||[])c.t-=dt;b3.claps=(b3.claps||[]).filter(c=>c.t>0);
  for(const f of b3.fx||[])f.t-=dt;b3.fx=(b3.fx||[]).filter(f=>f.t>0);
  if(b3.anim>0)b3.anim-=dt;
  if(b3.ph==='stunt'){
    if(b3.gap>0){b3.gap-=dt;if(b3.gap<=0){
      if(b3.miss>=3){endStunt(false);return;}
      if(b3.ti>=b3.tricks.length){endStunt(true);return;}
      newSeq(3+Math.floor(rand(0,2))+Math.min(2,Math.floor(f3().wins/2)),4,1.0*(5+Math.min(2,Math.floor(f3().wins/2)))+1.4);}}
    else if(b3.seq){b3.seq.t-=dt;if(b3.seq.t<=0){toast('⏰ 太慢了！');seqDone(false);}}
  }else if(b3.ph==='drum'){
    if(b3.gap>0){b3.gap-=dt;if(b3.gap<=0){if(b3.ri>=b3.rounds){endDrum();return;}const L=5+Math.floor(rand(0,3));newSeq(L,3,.85*L+1.6);}}
    else if(b3.seq){b3.seq.t-=dt;if(b3.seq.t<=0){toast('⏰ 太慢了！');seqDone(false);}}
  }else if(b3.ph==='uni'){
    const w=bike().front||bike().back,wf=w==='iron'?.7:w==='bolt'?1.25:1;
    b3.wind+=(rand(-1,1)*2.2-b3.wind*.6)*dt*wf;
    b3.vel+=(b3.ang*2.0+b3.wind*.9+b3.hold*3.4)*dt;b3.vel*=Math.pow(.6,dt);b3.ang+=b3.vel*dt;
    b3.left-=dt;
    if(Math.abs(b3.ang)>1.0){endUni(false);return;}
    if(b3.left<=0){endUni(true);return;}
  }else if(b3.ph==='chase')updChase(dt);
}

/* ---------- 結果 ---------- */
function winShow(money,msg){

    return;
  }
  showModal(`<h2>👏 ${msg}</h2><p>妖怪們乖乖坐在旁邊拍拍手！賺到 <b>💰 ${money}</b> 元。</p>
   <p>🌟 成功 <b>${F.wins} / ${SHOWS_TO_PASS}</b> 場　💰 現在有 ${save.money} 元</p>
   <div class="row"><button class="pill green" id="mGo">繼續</button></div>`);$('mGo').onclick=hideModal;
}
function endStunt(ok){
  if(ok){winShow(15,'特技表演成功！');return;}
  logRec('😠 特技表演出錯太多次，妖怪來吃輔助輪');
  startChase(['auxL','auxR'],'😠 表演一直出錯，妖怪生氣了！','牠們要來吃你的<b>輔助輪</b>！');
}
function endDrum(){
  const me=Math.round(b3.scores.reduce((a,x)=>a+x,0)/b3.rounds);
  const all=[{n:'我',e:IDS[P.id].e,score:me},...b3.rivals],votes=all.map(()=>0);

const STAGE_XP=[0,60,180];   // 到第 2、3 階段要的經驗
function petStage(p){return p.xp>=STAGE_XP[2]?3:p.xp>=STAGE_XP[1]?2:1;}
function petMax(p){return 50+petStage(p)*30+Math.floor(p.xp/6);}
function petMoves(p){const st=petStage(p),el=p.el;return['tackle',el+'1',...(st>=2?[el+'2']:[]),...(st>=3?[el+'3']:[])];}
function petAtk(p){return 1+petStage(p)*.2+p.xp/600;}

/* 寵物畫法：像耿鬼一樣黑黑圓圓、眼睛大大，頭上的刺和肚子是屬性顏色 */
function drawPet(c,x,y,size,el,stage,face,t,mood){
  const E=ELS[el],r=size*(.38+stage*.06),bob=Math.sin(t*4)*size*.03;
  c.save();c.translate(x,y+bob);c.scale(face||1,1);
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(0,r*.95-bob,r*.9,r*.25,0,0,7);c.fill();
  // 刺
  c.fillStyle='#2b2140';const sp=3+stage;
  for(let i=0;i<sp;i++){const a=-Math.PI*.85+i*(Math.PI*.7)/(sp-1),bx=Math.cos(a)*r*.8,by=Math.sin(a)*r*.8;
    c.beginPath();c.moveTo(bx-r*.16,by+r*.05);c.lineTo(Math.cos(a)*r*(1.25+stage*.05),Math.sin(a)*r*(1.25+stage*.05));c.lineTo(bx+r*.16,by+r*.05);c.fill();
    c.fillStyle=E.c;c.beginPath();c.arc(Math.cos(a)*r*1.18,Math.sin(a)*r*1.18,r*.07,0,7);c.fill();c.fillStyle='#2b2140';}
  // 身體
  const g=c.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r*1.05);g.addColorStop(0,'#5a4782');g.addColorStop(1,'#1d1530');
  c.fillStyle=g;c.beginPath();c.ellipse(0,0,r,r*.95,0,0,7);c.fill();
  // 手腳
  c.fillStyle='#241a3a';c.beginPath();c.ellipse(-r*.55,r*.85,r*.26,r*.16,0,0,7);c.ellipse(r*.55,r*.85,r*.26,r*.16,0,0,7);c.fill();
  c.beginPath();c.ellipse(-r*.98,r*.15,r*.16,r*.26,.4,0,7);c.ellipse(r*.98,r*.15,r*.16,r*.26,-.4,0,7);c.fill();
  // 肚子
  c.fillStyle=E.c;c.globalAlpha=.35;c.beginPath();c.ellipse(0,r*.42,r*.5,r*.32,0,0,7);c.fill();c.globalAlpha=1;
  // 大眼睛
  const blink=Math.sin(t*1.7)>.97;
  for(const sx of [-1,1]){const ex=sx*r*.34,ey=-r*.18;
    c.fillStyle='#fff';c.beginPath();c.ellipse(ex,ey,r*.27,blink?r*.04:r*.31,0,0,7);c.fill();
    if(!blink){c.fillStyle=mood==='hurt'?'#555':E.c;c.beginPath();c.arc(ex+r*.06,ey+r*.04,r*.17,0,7);c.fill();
      c.fillStyle='#111';c.beginPath();c.arc(ex+r*.07,ey+r*.05,r*.09,0,7);c.fill();
      c.fillStyle='#fff';c.beginPath();c.arc(ex+r*.01,ey-r*.05,r*.06,0,7);c.fill();}}
  // 嘴巴
  c.fillStyle='#fff';c.beginPath();c.moveTo(-r*.42,r*.2);c.quadraticCurveTo(0,mood==='hurt'?r*.3:r*.62,r*.42,r*.2);c.quadraticCurveTo(0,r*.36,-r*.42,r*.2);c.fill();
  c.strokeStyle='#2b2140';c.lineWidth=Math.max(1,r*.04);for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(i*r*.14,r*.24);c.lineTo(i*r*.14,r*.36);c.stroke();}
  c.restore();
}

function updVillage(dt){
  const F=f4();V.cool-=dt;
  let mx=0,my=0;const K=input.keys;
  if(K.KeyA||K.ArrowLeft)mx--;if(K.KeyD||K.ArrowRight)mx++;if(K.KeyW||K.ArrowUp)my--;if(K.KeyS||K.ArrowDown)my++;
  if(joy.active){const jx=joy.x-joy.bx,jy=joy.y-joy.by,l=hyp(jx,jy);if(l>8){const m=Math.min(1,l/55);mx+=jx/l*m;my+=jy/l*m;}}
  const ml=hyp(mx,my);if(ml>1){mx/=ml;my/=ml;}
  const sp=idk()==='racer'?230:180;
  if(!vBlocked(V.x+mx*sp*dt,V.y,14))V.x+=mx*sp*dt;if(!vBlocked(V.x,V.y+my*sp*dt,14))V.y+=my*sp*dt;
  V.moving=ml>.1;if(V.moving){V.fx=mx/ml;V.fy=my/ml;}
  if(!V.trail.length||hyp(V.x-V.trail[0].x,V.y-V.trail[0].y)>6){V.trail.unshift({x:V.x,y:V.y});if(V.trail.length>60)V.trail.pop();}
  const tp=V.trail[Math.min(V.trail.length-1,8)]||V;V.petPos.x+=(tp.x-V.petPos.x)*Math.min(1,dt*6);V.petPos.y+=(tp.y-V.petPos.y)*Math.min(1,dt*6);
  // 敵人在家附近晃
  for(const f of V.foes){if(f.dead)continue;f.t-=dt;if(f.t<=0){f.t=rand(1,3);f.ang=rand(0,6.28);}
    const nx=f.x+Math.cos(f.ang)*30*dt,ny=f.y+Math.sin(f.ang)*30*dt;if(hyp(nx-f.hx,ny-f.hy)<70&&!vBlocked(nx,ny,18)){f.x=nx;f.y=ny;}else f.ang+=Math.PI;
    if(V.cool<=0&&hyp(f.x-V.x,f.y-V.y)<38){V.cool=1.2;touchFoe(f);return;}}
  // 附近可以做的事
  let near=null;
  F.opened.length<V_BOX_POS.length&&V_BOX_POS.forEach((b,i)=>{if(!F.opened.includes(i)&&hyp(b[0]-V.x,b[1]-V.y)<60)near={k:'box',i};});
  for(const b of V_BUILD){if(b.k==='house')continue;const cx=b.x+b.w/2,cy=b.y+b.h;if(hyp(cx-V.x,cy+20-V.y)<80)near={k:b.k};}
  V.near=near;const a=$('v4Act');
  if(near){a.classList.remove('hidden');a.textContent=near.k==='box'?'📦 打開箱子':near.k==='shop'?'🏪 進商店':'🛏️ 睡覺補血';}else a.classList.add('hidden');
  for(const f of floats){f.t-=dt;f.y-=30*dt;}floats=floats.filter(f=>f.t>0);
  for(const p of parts){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;}parts=parts.filter(p=>p.t>0);
}
function drawVillage(){
  const z=cam.z=clamp(Math.min(W,H)/460,.6,1.4);
  cam.x+=(V.x-W/2/z-cam.x)*.18;cam.y+=(V.y-H/2/z-cam.y)*.18;
  ctx.fillStyle='#5aa850';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.scale(z,z);ctx.translate(-cam.x,-cam.y);
  ctx.fillStyle='#7cc46a';ctx.fillRect(0,0,VW4,VH4);
  for(let i=0;i<120;i++){const x=(i*397)%VW4,y=(i*631)%VH4;ctx.fillStyle='rgba(60,140,60,.5)';ctx.fillRect(x,y,4,9);}
  // 路
  ctx.fillStyle='#d9c79e';ctx.fillRect(0,600,VW4,90);ctx.fillRect(900,0,100,VH4);ctx.fillRect(0,360,VW4,60);ctx.fillRect(250,0,70,VH4);ctx.fillRect(1500,300,70,1100);ctx.fillRect(0,1150,VW4,60);
  ctx.strokeStyle='#b9a77e';ctx.lineWidth=2;ctx.setLineDash([16,14]);ctx.beginPath();ctx.moveTo(0,645);ctx.lineTo(VW4,645);ctx.moveTo(950,0);ctx.lineTo(950,VH4);ctx.stroke();ctx.setLineDash([]);
  V_TREES.forEach(t=>emo('🌳',t[0],t[1],56));

    ctx.fillStyle=b.col;ctx.fillRect(b.x,b.y+b.h*.35,b.w,b.h*.65);
    ctx.fillStyle=b.roof;ctx.beginPath();ctx.moveTo(b.x-14,b.y+b.h*.4);ctx.lineTo(b.x+b.w/2,b.y);ctx.lineTo(b.x+b.w+14,b.y+b.h*.4);ctx.closePath();ctx.fill();
    ctx.fillStyle='#6b4a2b';ctx.fillRect(b.x+b.w/2-18,b.y+b.h-46,36,46);

    if(b.e){emo(b.e,b.x+b.w/2,b.y+b.h*.3,38);txt(b.n,b.x+b.w/2,b.y+b.h+22,16,'#2a2416');}}

    const bob=Math.sin(T*3+i)*2;ctx.fillStyle=['#c9741a','#7c5cff','#3c9bff','#4cc35a'][i%4];rr(b[0]-18,b[1]-16+bob,36,30,6);ctx.fill();
    ctx.fillStyle='#ffd23f';ctx.fillRect(b[0]-18,b[1]-5+bob,36,6);ctx.fillRect(b[0]-3,b[1]-16+bob,6,30);emo('✨',b[0]+18,b[1]-20,14);});
  // 敵人
  for(const f of V.foes){if(f.dead)continue;const E=ELS[f.el],bob=Math.sin(T*5+f.id)*3;
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(f.x,f.y+18,18,6,0,0,7);ctx.fill();
    ctx.fillStyle=E.c;ctx.globalAlpha=.35;ctx.beginPath();ctx.arc(f.x,f.y+bob,24,0,7);ctx.fill();ctx.globalAlpha=1;
    emo(FOES[f.el].e,f.x,f.y+bob,36);
    const hp=foeMax(f),bw=46;ctx.fillStyle='rgba(0,0,0,.6)';rr(f.x-bw/2-2,f.y-42,bw+4,12,6);ctx.fill();ctx.fillStyle='#ff4d5e';rr(f.x-bw/2,f.y-40,bw,8,4);ctx.fill();
    txt(`${E.e}Lv${f.lv}`,f.x,f.y-52,12,'#fff');}

  drawHero(V.x,V.y,1,0,V.fx<0?-1:1,Math.atan2(V.fx,V.fy),V.moving);

  for(const f of floats){ctx.globalAlpha=Math.min(1,f.t*1.5);txt(f.s,f.x,f.y,f.size,f.col,'center',900);}ctx.globalAlpha=1;
  ctx.restore();
  // HUD

  txt(`🏘️ 4F 村莊　⚔️ 敵人剩 ${left}/${V_FOE_POS.length}`,22,26,14,'#fff','left',900);
  txt(`💰 ${save.money}　🍌${F.inv.banana} 🥭${F.inv.mango}　📦 ${F.opened.length}/${V_BOX_POS.length}`,22,48,13,'#ffe066','left',800);
  if(pet)txt(`${ELS[pet.el].e} ${pet.name}  ❤️ ${Math.max(0,Math.ceil(pet.hp))}/${petMax(pet)}　第 ${petStage(pet)} 階段`,22,68,12,pet.hp<=0?'#ff8a7a':'#bff7c3','left',800);
  if(joy.active){ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.bx,joy.by,55,0,7);ctx.stroke();
    const jx=joy.x-joy.bx,jy=joy.y-joy.by,l=hyp(jx,jy),m=Math.min(l,55)/(l||1);ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(joy.bx+jx*m,joy.by+jy*m,24,0,7);ctx.fill();}
}
function foeMax(f){return Math.round((40+f.lv*16)*FS.hp/1.6);}

/* ---------- 箱子與蛋 ---------- */
function openBox(i){
  const F=f4();if(F.opened.includes(i))return;F.opened.push(i);
  const el=pick(ELK);let kind;
  if(!F.pets.length)kind='pet';else{const r=Math.random();kind=r<.3?'pet':r<.65?'weak':'strong';}
  if(kind==='pet'&&F.pets.length>=3)kind='weak';
  persist();sfx(520,.1,'triangle',.05,300);
  showModal(`<h2>📦 打開箱子……</h2><div style="text-align:center;font-size:80px;line-height:1.2" id="eggBig">🥚</div>
   <p style="text-align:center">裡面有一顆 <b style="color:${ELS[el].c}">${ELS[el].e} ${ELS[el].n}屬性</b>的蛋！蛋在動了……</p>
   <div class="row"><button class="pill red" id="mGo">孵出來！</button></div>`);
  $('mGo').onclick=()=>{
    $('eggBig').textContent='🐣';sfx(880,.2,'triangle',.06,400);
    setTimeout(()=>{

function doMove(who,k){
  const pet=petOf(),me=who==='me';B4.busy=1.3;
  if(k==='dodge'){if(me){B4.dodge=true;B4.pos[0]=Math.max(0,B4.pos[0]-.1);}else{B4.fdodge=true;B4.pos[1]=Math.max(0,B4.pos[1]-.1);}
    btLog(`${me?pet.name:B4.fname}擺好姿勢準備<b>🛡️ 躲避</b>！`);B4.txt.push({s:'🛡️ 躲避！',me,t:1.1});sfx(600,.1,'sine',.05,200);}
  else{
    const m=MOVES[k],tgt=me?1:0,dodging=me?B4.fdodge:B4.dodge;
    B4.anim={who,k,t:.9};B4.txt.push({s:m.n+'！',me,t:1.2,big:true,col:m.el?ELS[m.el].c:'#fff'});
    if(me)B4.fdodge=false;else B4.dodge=false;
    const miss=Math.random()>(dodging?.25:m.acc);
    if(miss){btLog(`${me?pet.name:B4.fname}使出「<b>${m.n}</b>」！……${dodging?'被躲開了！':'沒打中！'}`);sfx(300,.1,'sine',.04,-200);}
    else{
      const aEl=m.el||(me?pet.el:B4.fel),dEl=me?B4.fel:pet.el,ef=m.el?eff(m.el,dEl):1;
      const atk=me?petAtk(pet):B4.fatk,dmg=Math.max(1,Math.round(m.pw*atk*ef*rand(.85,1.15)));
      const hpFrac=me?B4.fhp/B4.fmax:pet.hp/petMax(pet);
      const push=m.push*(ef>1?1.4:ef<1?.7:1)*(1+(1-clamp(hpFrac,0,1))*.9);
      if(me)B4.fhp-=dmg;else pet.hp-=dmg;B4.pos[tgt]+=push;B4.shake=ef>1?14:8;
      sfx(ef>1?140:200,.2,'sawtooth',.07,-80);
      btLog(`${me?pet.name:B4.fname}使出「<b>${m.n}</b>」！${ef>1?'<b style="color:#c4483a">效果絕佳！</b>':ef<1?'效果不太好……':''}造成 ${dmg} 傷害，${me?B4.fname:pet.name}被推開了！`);
      B4.txt.push({s:`-${dmg}`+(ef>1?' 效果絕佳！':ef<1?' 效果不好':''),me:!me,t:1.2,col:ef>1?'#ffd23f':'#fff'});}
  }
  btLater(()=>btAfter(who),1300);btButtons();
}
function btAfter(who){
  const pet=petOf();B4.busy=0;

  if(pet.hp<=0||out(0)){btEnd(false,out(0)?`${pet.name}被推出場地了！`:`${pet.name}沒力氣了……`);return;}
  if(who==='me'){B4.turn='foe';btButtons();btLater(()=>{if(scene!=='battle'||B4.over)return;
    // 敵人選招：危險時偶爾躲避，其他時候挑最痛的招
    let k;if(B4.pos[1]>.75&&Math.random()<.35)k='dodge';else{const ms=B4.moves.slice();k=Math.random()<.6?ms.sort((a,b)=>MOVES[b].pw*eff(MOVES[b].el||'x',pet.el)-MOVES[a].pw*eff(MOVES[a].el||'x',pet.el))[0]:pick(ms);}

     <div class="row"><button class="pill green" id="mGo">回村莊</button></div>`);
    $('mGo').onclick=()=>{hideModal();scene='village';setLayers();V.cool=2.5;const fx=f.x||V.x;V.x=clamp(V.x+(V.x-fx)*1.5,40,VW4-40);};}

function drawBattle(){

  if(STAGE_IMG.complete&&STAGE_IMG.naturalWidth){const iw=STAGE_IMG.naturalWidth,ih=STAGE_IMG.naturalHeight,s=Math.max(W/iw,H/ih);ctx.drawImage(STAGE_IMG,(W-iw*s)/2,(H-ih*s)/2,iw*s,ih*s);}

  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.setLineDash([12,8]);ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(cx,gy+10,half,34,0,0,7);ctx.stroke();ctx.setLineDash([]);

  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(fx,gy+8,40,10,0,0,7);ctx.fill();
  ctx.fillStyle=ELS[B4.fel].c;ctx.globalAlpha=.3;ctx.beginPath();ctx.arc(fx,gy-30,B4.foe.strong?62:46,0,7);ctx.fill();ctx.globalAlpha=1;

function stat(k,n){save.st=save.st||{};save.st[k]=(save.st[k]||0)+(n||1);}
function logRec(t){save.st=save.st||{};const d=new Date(),L=save.st.log=save.st.log||[];
  L.unshift({d:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,t});
  if(L.length>30)L.length=30;persist();}
function fmtTime(t){t=Math.floor(t||0);const h=Math.floor(t/3600),m=Math.floor(t/60)%60;return h?`${h} 小時 ${m} 分`:`${m} 分 ${t%60} 秒`;}
function openRecords(){
  if(scene!=='home'&&!$('modal').classList.contains('hidden')&&!document.getElementById('pRes'))return;
  input.atk=false;input.keys={};joy.active=false;
  const st=save.st||{},c=save.c2,cur=scene==='home'?(save.floor||1):curFloor;
  const box=(v,l)=>`<div class="st"><b>${v}</b><span>${l}</span></div>`;
  let h=`<h2>📜 我的紀錄</h2><div class="stats">
    ${box(cur+' 樓','現在在')}${box(Math.max(save.best||1,cur)+' 樓','最高到過')}${box(save.clears||0,'過關次數')}${box(save.tops||0,'登上 100 樓')}
    ${box(st.rescued||0,'救回的人')}${box(st.monster||0,'變成妖怪')}${box(st.bosses||0,'打倒魔王')}${box(st.climbs||0,'攀岩進大樓')}${box(st.pets||0,'孵出寵物')}${box(st.battles||0,'寵物對戰勝利')}${box((st.contestWins||0)+' / '+(st.contests||0),'畫畫比賽 贏／比')}${box(st.shows||0,'馬戲團成功表演')}${box(st.escapes||0,'逃過妖怪')}${box(st.bestVotes||0,'畫畫最高分')}
    ${box('💰 '+save.money,'現在的錢')}${box((save.toys||[]).length+' / '+TOYS.length,'收集的玩具')}${box(fmtTime(st.time),'一共玩了')}${box(IDS[P.id].e+' '+IDS[P.id].n,'現在的身分')}
  </div>`;
  const now=c&&c.rounds&&c.rounds.length?c.rounds.map(r=>r.imgs[0]):null,pics=now||st.lastPics;
  if(pics&&pics.length)h+=`<h3>🖼️ ${now?`這次畫畫比賽畫好的圖（${pics.length}/${ROUNDS}）`:'上一次畫畫比賽我畫的圖'}</h3><div class="gal">${pics.map(s=>`<img src="${s}" alt="">`).join('')}</div>`;
  const L=st.log||[];
  h+=`<h3>🕒 最近發生的事</h3>${L.length?`<ul class="log">${L.slice(0,12).map(x=>`<li><small>${x.d}</small>${x.t}</li>`).join('')}</ul>`:'<p style="color:#9c8a66">還沒有紀錄，去最高樓救人吧！</p>'}
   <p style="color:#7a6a4a;font-size:13px;margin-top:8px">💾 紀錄會自動存在這支手機的瀏覽器裡。</p>
   <div class="row"><button class="pill green" id="rClose">關閉</button></div>`;
  showModal(h);$('rClose').onclick=hideModal;
}
$('hRec').onclick=openRecords;
$('bRec').addEventListener('pointerdown',e=>{e.preventDefault();if(canPause())openRecords();});

/* ---------- 暫停 / 存檔 ---------- */
function canPause(){return (scene==='floor'||scene==='drive'||scene==='draw2'||scene==='bike3'||scene==='climb'||scene==='village'||scene==='battle')&&$('modal').classList.contains('hidden')&&!drawUIOpen();}
function openPause(){
  if(!canPause())return;
  input.atk=false;input.keys={};joy.active=false;
  showModal(`<h2>⏸ 暫停</h2>
   <p>🏢 現在在 <b>${scene==='drive'?'開車去最高樓的路上':scene==='climb'?'大樓外牆，'+climbFloorNow()+' 樓的高度':curFloor+' 樓'}</b>（最高紀錄 ${Math.max(save.best||1,curFloor)} 樓）</p>
   <p>💰 ${save.money} 元　🎖️ 過關 ${save.clears} 次</p>
   ${scene==='bike3'?`<p>🚲 特技秀：成功 ${(save.f3&&save.f3.wins)||0} / ${SHOWS_TO_PASS} 場　車子：${bikeText()}</p>`:''}
   ${scene==='draw2'?`<p>🎨 畫畫比賽：已經畫了 ${(save.c2&&save.c2.rounds.length)||0} / 10 張（畫好的圖都有存起來）</p>`:''}
   <p style="color:#7a6a4a">💾 存檔會記住樓層、錢和玩具。回家後接電話，會從這一層的開頭繼續。</p>
   <div class="row"><button class="pill green" id="pRes">▶️ 繼續</button><button class="pill blue" id="pSave">💾 存檔回家</button><button class="pill red" id="pRec">📜 看紀錄</button></div>`);
  $('pRes').onclick=hideModal;
  $('pRec').onclick=openRecords;
  $('pSave').onclick=()=>{persist();hideModal();home.ring=false;enterHome();toast('💾 已存檔！按「📞 等任務電話」就能繼續',2600);};
}
$('bPause').addEventListener('pointerdown',e=>{e.preventDefault();openPause();});
$('bPause2').addEventListener('pointerdown',e=>{e.preventDefault();openPause();});
addEventListener('keydown',e=>{if(e.code==='KeyP'||e.code==='Escape'){if(canPause())openPause();else if(document.getElementById('pRes'))hideModal();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&canPause())openPause();});

/* ---------- 按鈕狀態 ---------- */
let lastBtn='';
function refreshButtons(){
  const mon=mode==='monster',k=idk();
  const holders=followers.filter(f=>f.weapon);
  const sig=[mon,k,P.weapon,holders.map(f=>f.weapon).join(),followers.reduce((s,f)=>s+f.hp,0),P.id].join('|');if(sig===lastBtn)return;lastBtn=sig;
  $('atkEm').textContent=mon?'👹':WEAPONS[P.weapon].e;
  $('swapEm').textContent=mon?'🚫':(holders.length?WEAPONS[holders[0].weapon].e:'🔄');
  $('healTxt').textContent=mon?'—':'補血 '+followers.reduce((s,f)=>s+f.hp,0);
  $('idEm').textContent=mon?'👹':IDS[P.id].e;$('idEm2').textContent=IDS[P.id].e;
  $('bRoll').classList.toggle('hidden',mon||k!=='stunt');
}
function setLayers(){
  $('ctlFloor').classList.toggle('hidden',scene!=='floor'&&scene!=='draw2');
  ['bAtk','bSwap','bHeal','bRoll'].forEach(id=>$(id).style.visibility=scene==='draw2'?'hidden':'');
  $('ctlDrive').classList.toggle('hidden',scene!=='drive');
  $('ctl3').classList.toggle('hidden',scene!=='bike3');
  $('ctl4').classList.toggle('hidden',scene!=='village');$('bt4').classList.toggle('hidden',scene!=='battle');
  $('ctlClimb').classList.toggle('hidden',scene!=='climb');$('cvClimb').style.display=scene==='climb'?'block':'none';
  $('ctlHome').classList.toggle('hidden',scene!=='home');
  joy.active=false;input.atk=false;lastBtn='';refreshButtons();
}

/* ---------- 輸入 ---------- */
const jz=$('joyZone');
jz.addEventListener('pointerdown',e=>{e.preventDefault();if(joy.active)return;joy.active=true;joy.id=e.pointerId;joy.bx=joy.x=e.clientX;joy.by=joy.y=e.clientY;try{jz.setPointerCapture(e.pointerId);}catch(_){}});
jz.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY;}});
const endJoy=e=>{if(e.pointerId===joy.id)joy.active=false;};
jz.addEventListener('pointerup',endJoy);jz.addEventListener('pointercancel',endJoy);
function holdBtn(el,on,off){el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');try{el.setPointerCapture(e.pointerId);}catch(_){}on();});
  const end=()=>{el.classList.remove('on');off&&off();};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);}
holdBtn($('bAtk'),()=>{input.atk=true;},()=>{input.atk=false;});
holdBtn($('bSwap'),doSwap);holdBtn($('bHeal'),doHeal);holdBtn($('bId'),openIdentity);holdBtn($('bRoll'),doRoll);
cv.addEventListener('pointerdown',e=>{if(scene==='home')homeTap(e.clientX,e.clientY);});
addEventListener('keydown',e=>{input.keys[e.code]=true;
  if(scene==='drive'){if(e.code==='ArrowLeft'||e.code==='KeyA')laneMove(-1);if(e.code==='ArrowRight'||e.code==='KeyD')laneMove(1);}
  if(scene==='floor'){if(e.code==='KeyK')doSwap();if(e.code==='KeyL')doHeal();if(e.code==='KeyQ')openIdentity();if(e.code==='ShiftLeft'||e.code==='ShiftRight')doRoll();}
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>{input.keys[e.code]=false;});
addEventListener('blur',()=>{input.keys={};input.atk=false;joy.active=false;});

/* ---------- 主迴圈 ---------- */
let last=performance.now();
function frame(now){
  let dt=Math.min(.033,(now-last)/1000);last=now;T+=dt;shake=Math.max(0,shake-dt*40);
  const paused=!$('modal').classList.contains('hidden');
  if(!paused&&(scene==='floor'||scene==='drive'||scene==='draw2'||scene==='bike3'||scene==='climb'||scene==='village'||scene==='battle')&&!(dr.open&&dr.paused)){save.st.time=(save.st.time||0)+dt;if((save.st.time%10)<dt)persist();}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(scene==='home')drawHome(dt);
  else if(scene==='drive'){if(!paused)updDrive(dt);ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));drawDrive();ctx.restore();}
  else if(scene==='draw2'){if(!paused&&!dr.open)updDraw2(dt);drawDraw2();if(dr.open)updDrawUI(dt);}
  else if(scene==='bike3'){if(!paused)upd3(dt);draw3();}
  else if(scene==='village'){if(!paused)updVillage(dt);drawVillage();}
  else if(scene==='battle'){if(!paused)updBattle(dt);drawBattle();}
  else if(scene==='climb'){if(!paused)updClimb(dt);drawClimb();}
  else if(scene==='floor'||scene==='result'){if(!paused&&scene==='floor')updFloor(dt);if(curFloor===2&&scene==='result')drawDraw2();else if(curFloor===3&&scene==='result')draw3();else if(curFloor===4&&scene==='result')drawVillage();else drawFloor();}
  requestAnimationFrame(frame);
}
P.r=idk()==='kid'?11:14;
enterHome();
toast('📞 電話響了！點電話接聽',3000);
requestAnimationFrame(frame);
</script>
</body>
</html>
