function addSeg(ax,ay,bx,by){walls.push({ax,ay,bx,by,x0:Math.min(ax,bx),x1:Math.max(ax,bx),y0:Math.min(ay,by),y1:Math.max(ay,by)});}
function segPt(px,py,w){const dx=w.bx-w.ax,dy=w.by-w.ay,l=dx*dx+dy*dy;let t=l?((px-w.ax)*dx+(py-w.ay)*dy)/l:0;t=t<0?0:t>1?1:t;const cx=w.ax+dx*t,cy=w.ay+dy*t;return[cx,cy,hyp(px-cx,py-cy),t];}
function addPoly(pts,doors){
  for(let i=0;i<pts.length;i++){
    const a=pts[i],b=pts[(i+1)%pts.length],w={ax:a[0],ay:a[1],bx:b[0],by:b[1]},L=hyp(b[0]-a[0],b[1]-a[1]);
    const cuts=[];
    (doors||[]).forEach(d=>{const r=segPt(d[0],d[1],w);if(r[2]<14){const h=d[2]/2/L;cuts.push([r[3]-h,r[3]+h]);}});
    cuts.sort((p,q)=>p[0]-q[0]);
    let t=0;
    for(const c of cuts){if(c[0]>t)addSeg(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[0]+(b[0]-a[0])*c[0],a[1]+(b[1]-a[1])*c[0]);t=Math.max(t,c[1]);}
    if(t<1)addSeg(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,b[0],b[1]);
  }
}

function pip(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function roomAt(x,y){for(let i=0;i<ROOMS.length;i++)if(pip(x,y,ROOMS[i].pts))return i;return null;}
function wallDist(x,y){let m=1e9;for(const w of walls){const d=segPt(x,y,w)[2];if(d<m)m=d;}return m;}
function rayT(ax,ay,bx,by){let best=1;const rx=bx-ax,ry=by-ay;
  for(const w of walls){const sx=w.bx-w.ax,sy=w.by-w.ay,d=rx*sy-ry*sx;if(!d)continue;
    const cx=w.ax-ax,cy=w.ay-ay,u=(cx*sy-cy*sx)/d,v=(cx*ry-cy*rx)/d;if(u>=0&&u<best&&v>=0&&v<=1)best=u;}
  return best;}
function los(ax,ay,bx,by){return rayT(ax,ay,bx,by)>=1;}
function collide(o){
  for(let k=0;k<2;k++)for(const w of walls){
    if(o.x<w.x0-o.r||o.x>w.x1+o.r||o.y<w.y0-o.r||o.y>w.y1+o.r)continue;
    const r=segPt(o.x,o.y,w);if(r[2]<o.r&&r[2]>1e-4){o.x=r[0]+(o.x-r[0])/r[2]*o.r;o.y=r[1]+(o.y-r[1])/r[2]*o.r;}
  }
}
function randInRoom(i,margin){const r=ROOMS[i];let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;r.pts.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});
  for(let k=0;k<400;k++){const x=rand(x0,x1),y=rand(y0,y1);if(pip(x,y,r.pts)&&wallDist(x,y)>margin)return[x,y];}return[r.cx,r.cy];}

/* 尋路格（BFS 流場） */
const CELL=25,GW=Math.ceil(2200/CELL),GH=Math.ceil(1400/CELL);
const blocked=new Uint8Array(GW*GH),fdist=new Int32Array(GW*GH),bq=new Int32Array(GW*GH);
for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const x=gx*CELL+CELL/2,y=gy*CELL+CELL/2;blocked[gy*GW+gx]=(!pip(x,y,OUT)||wallDist(x,y)<14)?1:0;}
function flow(tx,ty){
  fdist.fill(-1);let s=clamp(Math.floor(ty/CELL),0,GH-1)*GW+clamp(Math.floor(tx/CELL),0,GW-1);
  if(blocked[s]){const gx=s%GW,gy=(s/GW)|0;let f=-1;for(let r=1;r<3&&f<0;r++)for(let dy=-r;dy<=r&&f<0;dy++)for(let dx=-r;dx<=r;dx++){const nx=gx+dx,ny=gy+dy;if(nx>=0&&ny>=0&&nx<GW&&ny<GH&&!blocked[ny*GW+nx]){f=ny*GW+nx;break;}}if(f<0)return;s=f;}
  let h=0,t=0;bq[t++]=s;fdist[s]=0;
  while(h<t){const c=bq[h++],cx=c%GW,cy=(c/GW)|0,d=fdist[c]+1;
    if(cx>0){const n=c-1;if(!blocked[n]&&fdist[n]<0){fdist[n]=d;bq[t++]=n;}}
    if(cx<GW-1){const n=c+1;if(!blocked[n]&&fdist[n]<0){fdist[n]=d;bq[t++]=n;}}
    if(cy>0){const n=c-GW;if(!blocked[n]&&fdist[n]<0){fdist[n]=d;bq[t++]=n;}}
    if(cy<GH-1){const n=c+GW;if(!blocked[n]&&fdist[n]<0){fdist[n]=d;bq[t++]=n;}}}
}
function navDir(e){const gx=Math.floor(e.x/CELL),gy=Math.floor(e.y/CELL);let best=-1,bd=1e9;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=gx+dx,ny=gy+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;const n=ny*GW+nx;
    if(blocked[n]||fdist[n]<0)continue;const v=fdist[n]+(dx&&dy?.4:0);if(v<bd){bd=v;best=n;}}
  if(best<0){const dx=P.x-e.x,dy=P.y-e.y,l=hyp(dx,dy)||1;return[dx/l,dy/l];}
  const tx=(best%GW)*CELL+CELL/2,ty=((best/GW)|0)*CELL+CELL/2,dx=tx-e.x,dy=ty-e.y,l=hyp(dx,dy)||1;return[dx/l,dy/l];}

/* 主角畫法（家裡、開車、樓層共用）：three.js 立體模型，畫進 2D 畫面 */
const Hero3D=(function(){
  if(!window.THREE)return null;
  try{
    const S=224,R=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});
    R.setPixelRatio(1);R.setSize(S,S,false);R.setClearColor(0x000000,0);
    const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(28,1,.1,50);
    cam.position.set(0,4.6,7.4);cam.lookAt(0,1.15,0);
    sc.add(new THREE.HemisphereLight(0xffffff,0x6a5a48,.85));
    const sun=new THREE.DirectionalLight(0xffffff,.75);sun.position.set(3,6,5);sc.add(sun);
    const rim=new THREE.DirectionalLight(0xbfdcff,.35);rim.position.set(-4,3,-4);sc.add(rim);
    const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.05});
    const mesh=(g,c,x,y,z,par)=>{const m=new THREE.Mesh(g,M(c));m.position.set(x||0,y||0,z||0);(par||root).add(m);return m;};
    const root=new THREE.Group();sc.add(root);
    let built=-1,legL,legR,armL,armR,body;
    function limb(c,len,r){const g=new THREE.Group(),m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.9,len,12),M(c));m.position.y=-len/2;g.add(m);
      const tip=new THREE.Mesh(new THREE.SphereGeometry(r*1.15,12,10),M(c));tip.position.y=-len;g.add(tip);return g;}
    function build(i){
      while(root.children.length)root.remove(root.children[0]);
      const id=IDS[i],k=id.k;
      // 腿、鞋
      legL=limb('#3d4258',.62,.17);legL.position.set(-.24,.72,0);root.add(legL);
      legR=limb('#3d4258',.62,.17);legR.position.set(.24,.72,0);root.add(legR);
      [legL,legR].forEach(l=>{const sh=new THREE.Mesh(new THREE.BoxGeometry(.3,.16,.42),M('#2a2a30'));sh.position.set(0,-.66,.08);l.add(sh);});
      // 身體
      body=mesh(new THREE.SphereGeometry(.62,24,18),id.c,0,1.12,0);body.scale.set(1,1.08,.85);
      mesh(new THREE.CylinderGeometry(.5,.58,.18,20),'#3d4258',0,.74,0);           // 腰帶
      // 手
      armL=limb(id.c,.55,.14);armL.position.set(-.62,1.42,0);armL.rotation.z=-.35;root.add(armL);
      armR=limb(id.c,.55,.14);armR.position.set(.62,1.42,0);armR.rotation.z=.35;root.add(armR);
      [armL,armR].forEach(a=>{a.children[1].material=M('#ffd9b0');});
      // 頭
      const head=mesh(new THREE.SphereGeometry(.56,28,22),'#ffd9b0',0,2.08,0);
      mesh(new THREE.SphereGeometry(.085,10,8),'#222',-.19,2.12,.5);mesh(new THREE.SphereGeometry(.085,10,8),'#222',.19,2.12,.5);
      mesh(new THREE.SphereGeometry(.03,6,6),'#fff',-.17,2.15,.58);mesh(new THREE.SphereGeometry(.03,6,6),'#fff',.21,2.15,.58);
      const ck1=mesh(new THREE.SphereGeometry(.08,10,8),'#ff9aa8',-.32,1.98,.42),ck2=mesh(new THREE.SphereGeometry(.08,10,8),'#ff9aa8',.32,1.98,.42);ck1.scale.z=ck2.scale.z=.4;
      const mouth=mesh(new THREE.TorusGeometry(.09,.022,6,12,Math.PI),'#a33',0,1.94,.52);mouth.rotation.z=Math.PI;
      // 帽子
      const cap=mesh(new THREE.SphereGeometry(.58,26,16,0,Math.PI*2,0,Math.PI/2),id.hat,0,2.16,0);cap.scale.y=.75;
      if(k==='racer'){cap.scale.set(1.08,1.15,1.08);const vis=mesh(new THREE.BoxGeometry(.7,.16,.12),'#7fd3ff',0,2.22,.55);vis.material.metalness=.5;}
      else if(k==='nurse'){cap.scale.y=.55;mesh(new THREE.BoxGeometry(.08,.26,.05),'#e8483a',0,2.5,.4);mesh(new THREE.BoxGeometry(.26,.08,.05),'#e8483a',0,2.5,.4);}
      else{const brim=mesh(new THREE.CylinderGeometry(.42,.42,.05,20,1,false,-Math.PI/2,Math.PI),id.hat,0,2.17,.22);brim.scale.z=1.1;}
      if(k==='police')mesh(new THREE.SphereGeometry(.09,10,8),'#ffd65c',0,2.42,.42);
      if(k==='hunter'){const f=mesh(new THREE.ConeGeometry(.06,.5,8),'#e8483a',.4,2.55,-.05);f.rotation.z=-.6;}
      if(k==='kid'){mesh(new THREE.BoxGeometry(.7,.75,.32),id.hat,0,1.18,-.52);}
      if(k==='mail'){const bag=mesh(new THREE.BoxGeometry(.32,.38,.2),'#8a5a30',.62,1.0,.18);bag.rotation.z=.2;}
      if(k==='stunt')mesh(new THREE.OctahedronGeometry(.16),'#ffd65c',0,1.2,.55);
      if(k==='police'){const b=mesh(new THREE.BoxGeometry(.14,.16,.04),'#ffd65c',-.25,1.36,.5);}
      built=i;
    }
    // 每個方向／步伐只算一次 3D，之後直接貼圖（手機也順）
    const DIRS=16,STEPS=8,cache=new Map();
    function frame(a,st){
      const key=P.id+'|'+a+'|'+st;let c=cache.get(key);if(c)return c;
      if(built!==P.id)build(P.id);
      root.rotation.y=a/DIRS*Math.PI*2;
      const ph=st/STEPS*Math.PI*2,sw=st<0?0:Math.sin(ph)*.6;
      legL.rotation.x=sw;legR.rotation.x=-sw;armL.rotation.x=-sw*.8;armR.rotation.x=sw*.8;
      root.position.y=st<0?0:Math.abs(Math.sin(ph))*.08;
      R.render(sc,cam);
      c=document.createElement('canvas');c.width=c.height=S;c.getContext('2d').drawImage(R.domElement,0,0);
      if(cache.size>700)cache.clear();
      cache.set(key,c);return c;
    }
    return{
      draw(x,y,size,ang,walk,t){
        const a=((Math.round(ang/(Math.PI*2)*DIRS)%DIRS)+DIRS)%DIRS;
        const st=walk?Math.floor(t*12/(Math.PI*2)*STEPS)%STEPS:-1;
        const bob=walk?0:Math.sin(t*2.4)*size*.012;
        ctx.drawImage(frame(a,st),x-size/2,y-size*.8+bob,size,size);
      }
    };
  }catch(e){console.warn('3D 主角無法使用，改用平面版',e);return null;}
})();
function drawHero(x,y,sc,tilt,dir,ang,walk){

  if(Hero3D){

    Hero3D.draw(0,r*.9,r*4.4,ang,walk,T);

  }
  ctx.fillStyle=id.c;ctx.beginPath();ctx.arc(0,r*.25,r,0,7);ctx.fill();
  ctx.fillStyle='#ffd9b0';ctx.beginPath();ctx.arc(0,-r*.55,r*.72,0,7);ctx.fill();
  ctx.fillStyle=id.hat;ctx.beginPath();ctx.arc(0,-r*.7,r*.74,Math.PI,0);ctx.fill();ctx.fillRect(dir<0?-r*1.05:0,-r*.78,r*1.05,r*.16);
  if(id.k==='nurse'){ctx.fillStyle='#e8483a';ctx.fillRect(-r*.12,-r*1.25,r*.24,r*.5);ctx.fillRect(-r*.25,-r*1.12,r*.5,r*.24);}
  if(id.k==='police'){ctx.fillStyle='#ffd65c';ctx.beginPath();ctx.arc(0,-r*1.0,r*.14,0,7);ctx.fill();}
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-r*.25+dir*r*.12,-r*.5,r*.09,0,7);ctx.arc(r*.25+dir*r*.12,-r*.5,r*.09,0,7);ctx.fill();
  emo(id.e,r*.55,r*.45,r*.85);

}

function laneX(l){const rw=Math.min(W*.62,330);return W/2-rw/2+rw*(l+.5)/3;}
function updDrive(dt){
  const sp=(idk()==='racer'?440:340)*(drive.slow>0?.4:1);
  drive.slow-=dt;drive.crash-=dt;
  if(!drive.done){drive.dist+=sp*dt;}
  const tx=laneX(drive.lane);if(!drive.x)drive.x=tx;drive.x+=(tx-drive.x)*Math.min(1,dt*12);
  while(drive.spawnD<drive.dist+H+200&&drive.spawnD<drive.len-300){

    const l=Math.floor(rand(0,3));

      else{save.money++;drive.coins++;persist();sfx(1300,.06,'square',.03,300);}}

/* ---------- 敵人 AI ---------- */
function chase(e,sp,dt){let mx,my;if(e.seen){mx=P.x-e.x;my=P.y-e.y;const l=hyp(mx,my)||1;mx/=l;my/=l;}else[mx,my]=navDir(e);e.x+=mx*sp*dt;e.y+=my*sp*dt;collide(e);}
function away(e,sp,dt){const dx=e.x-P.x,dy=e.y-P.y,l=hyp(dx,dy)||1;e.x+=dx/l*sp*dt;e.y+=dy/l*sp*dt;collide(e);}
function wander(e,dt,sp){
  e.wt-=dt;if(e.wt<=0){e.wt=rand(1,2.6);const a=rand(0,6.28),still=Math.random()<.3;e.wdx=still?0:Math.cos(a);e.wdy=still?0:Math.sin(a);}
  const nx=e.x+e.wdx*sp*dt,ny=e.y+e.wdy*sp*dt;
  if(e.room!=null&&!pip(nx,ny,ROOMS[e.room].pts)){e.wdx*=-1;e.wdy*=-1;return;}
  e.x=nx;e.y=ny;collide(e);if(e.wdx)e.face=e.wdx<0?-1:1;
}
function lobAt(kind,e,tx,ty,T){lobs.push({kind,sx:e.x,sy:e.y,tx,ty,t:0,T});}
function updEnemy(e,dt){
  e.flash-=dt;e.frozen-=dt;e.stab-=dt;e.cd-=dt*(e.frozen>0?.4:1);
  const sp=e.spd*(e.frozen>0?.35:1),dx=P.x-e.x,dy=P.y-e.y,d=hyp(dx,dy)||1;
  e.losT-=dt;if(e.losT<=0){e.losT=.18+Math.random()*.1;e.seen=d<620&&los(e.x,e.y,P.x,P.y);}
  if(!isHostile(e)){wander(e,dt,sp*.55);return;}
  if(!e.aggro){if((e.seen&&d<300)||e.kind==='human')e.aggro=true;else{wander(e,dt,sp*.5);return;}}
  if(e.wind<=0)e.face=dx<0?-1:1;
  const pr=e.r+P.r;
  switch(e.kind){
    case'zombie':
      if(!e.seen||d>230)chase(e,sp,dt);else if(d<140)away(e,sp*.6,dt);
      if(e.seen&&d<420&&e.cd<=0){bullets.push({x:e.x+dx/d*14,y:e.y+dy/d*14-4,vx:dx/d*250,vy:dy/d*250,dmg:8,own:'e',life:2,r:6,col:'#e8f5c8',tooth:1});e.cd=1.6;sfx(240,.05,'square',.02);}
      break;
    case'slime':
      if(!e.seen||d>200)chase(e,sp,dt);
      if(e.seen&&d<380&&e.cd<=0){lobAt('goo',e,P.x+rand(-20,20),P.y+rand(-20,20),.7);e.cd=2.8;sfx(200,.15,'sine',.04,-80);}
      break;
    case'snake':
      if(e.wind>0){e.wind-=dt;if(e.wind<=0){e.stab=.2;e.cd=1.3;if(d<pr+38)hurtPlayer(14);sfx(330,.08,'sawtooth',.04,-200);}}
      else{if(d>pr+16)chase(e,sp,dt);if(d<pr+30&&e.cd<=0&&e.seen)e.wind=.5;}
      break;
    case'banana':
      if(!e.seen||d>270)chase(e,sp,dt);else if(d<170)away(e,sp,dt);
      if(e.seen&&d<360&&e.cd<=0){lobAt('bomb',e,P.x+rand(-10,10),P.y+rand(-10,10),.8);e.cd=2.4;}
      break;
    case'boss':bossAI(e,dt,d,dx,dy,sp,pr);break;
    case'human':
      if(!e.seen||d>220)chase(e,sp,dt);else if(d<110)away(e,sp*.7,dt);
      if(e.seen&&d<320&&e.cd<=0){bullets.push({x:e.x,y:e.y,vx:dx/d*290,vy:dy/d*290,dmg:7,own:'e',life:1.4,r:6,col:'#cfd6e0',staple:1});e.cd=1.3;}
      break;
  }
}

/* ---------- 樓層更新 ---------- */
function updFloor(dt){
  const k=idk();
  // 玩家移動
  P.inv-=dt;P.cd-=dt;P.rollCd-=dt;P.slow-=dt;
  let mx=0,my=0;const K=input.keys;
  if(K.KeyA||K.ArrowLeft)mx--;if(K.KeyD||K.ArrowRight)mx++;if(K.KeyW||K.ArrowUp)my--;if(K.KeyS||K.ArrowDown)my++;
  if(joy.active){const jx=joy.x-joy.bx,jy=joy.y-joy.by,l=hyp(jx,jy);if(l>8){const m=Math.min(1,l/55);mx+=jx/l*m;my+=jy/l*m;}}
  const ml=hyp(mx,my);if(ml>1){mx/=ml;my/=ml;}
  let sp=mode==='monster'?175:(k==='racer'?220:160);if(P.slow>0)sp*=.55;
  if(P.roll>0){P.roll-=dt;P.x+=P.rdx*430*dt;P.y+=P.rdy*430*dt;}else{P.x+=mx*sp*dt;P.y+=my*sp*dt;}
  collide(P);
  P.moving=ml>.1;if(P.moving&&!(input.atk&&P.cd>0)){P.fx=mx/Math.max(ml,1e-3);P.fy=my/Math.max(ml,1e-3);const l=hyp(P.fx,P.fy)||1;P.fx/=l;P.fy/=l;}
  if(!trail.length||hyp(P.x-trail[0].x,P.y-trail[0].y)>6){trail.unshift({x:P.x,y:P.y});if(trail.length>500)trail.pop();}
  if(input.atk||K.KeyJ||K.Space)tryAttack();
  // 跟班
  followers.forEach((f,i)=>{const tp=trail[Math.min(trail.length-1,(i+1)*5)]||P;f.x+=(tp.x-f.x)*Math.min(1,dt*8);f.y+=(tp.y-f.y)*Math.min(1,dt*8);});
  // 流場
  flowT-=dt;if(flowT<=0){flowT=.3;flow(P.x,P.y);}
  // 敵人
  for(const e of enemies)if(!e.dead)updEnemy(e,dt);
  for(let i=0;i<enemies.length;i++){const a=enemies[i];if(a.dead)continue;for(let j=i+1;j<enemies.length;j++){const b=enemies[j];if(b.dead)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=hyp(dx,dy),m=a.r+b.r;if(d<m&&d>0){const p=(m-d)/2;a.x-=dx/d*p;a.y-=dy/d*p;b.x+=dx/d*p;b.y+=dy/d*p;}}}
  // 子彈
  for(const b of bullets){
    if(b.kind==='boomer'){b.t+=dt;b.rot+=dt*18;if(b.t>b.T/2){const dx=P.x-b.x,dy=P.y-b.y,l=hyp(dx,dy)||1;b.vx=dx/l*b.sp;b.vy=dy/l*b.sp;if(l<20)b.life=0;}}
    const nx=b.x+b.vx*dt,ny=b.y+b.vy*dt;
    if(b.kind!=='boomer'&&!los(b.x,b.y,nx,ny)){b.life=0;burst(b.x,b.y,b.col,4);continue;}
    b.x=nx;b.y=ny;b.life-=dt;
    if(b.own==='p'){for(const e of enemies){if(e.dead||!isHostile(e))continue;if(hyp(e.x-b.x,e.y-b.y)<e.r+b.r){
        if(b.kind==='boomer'){const last=b.hits.get(e)||-9;if(T-last<.35)continue;b.hits.set(e,T);hurtEnemy(e,b.dmg,b.vx/b.sp,b.vy/b.sp);}
        else{const l=hyp(b.vx,b.vy)||1;hurtEnemy(e,b.dmg,b.vx/l,b.vy/l);if(b.freeze)e.frozen=1.6;b.life=0;break;}}}}
    else if(hyp(P.x-b.x,P.y-b.y)<P.r+b.r){hurtPlayer(b.dmg);b.life=0;}
  }
  bullets=bullets.filter(b=>b.life>0);
  // 拋物
  for(const l of lobs){l.t+=dt;if(l.t>=l.T){l.done=1;
    if(l.kind==='grenade'){booms.push({x:l.tx,y:l.ty,r:l.rad,t:.35});shake=9;sfx(90,.35,'sawtooth',.08,-50);
      for(const e of enemies){if(!e.dead&&isHostile(e)&&hyp(e.x-l.tx,e.y-l.ty)<l.rad+e.r){const dx=e.x-l.tx,dy=e.y-l.ty,d=hyp(dx,dy)||1;hurtEnemy(e,l.dmg,dx/d*2,dy/d*2);}}}
    else if(l.kind==='bomb')fuses.push({x:l.tx,y:l.ty,t:1.0,r:66});
    else if(l.kind==='goo'){puddles.push({x:l.tx,y:l.ty,r:16,max:rand(80,100),life:13});sfx(160,.12,'sine',.04,-60);}}}
  lobs=lobs.filter(l=>!l.done);
  for(const f of fuses){f.t-=dt;if(f.t<=0){booms.push({x:f.x,y:f.y,r:f.r,t:.35});shake=8;sfx(80,.3,'sawtooth',.07,-40);if(hyp(P.x-f.x,P.y-f.y)<f.r+P.r)hurtPlayer(18);}}
  fuses=fuses.filter(f=>f.t>0);
  // 黏液
  let inGoo=false;
  for(const p of puddles){p.life-=dt;if(p.r<p.max)p.r+=7*dt;if(p.life<2)p.r-=20*dt;if(mode==='human'&&hyp(P.x-p.x,P.y-p.y)<p.r+P.r*.4)inGoo=true;}
  puddles=puddles.filter(p=>p.life>0&&p.r>4);
  if(inGoo){P.slow=.15;P.gooTick-=dt;if(P.gooTick<=0&&P.roll<=0){P.gooTick=.35;const gd=Math.round(4*FS.dmg);P.hp-=gd;floatT(P.x,P.y-28,'-'+gd+' 黏黏！','#9be37a',14);if(P.hp<=0)onZero();}}
  // 物品
  for(const it of items){it.t+=dt;it.lock-=dt;const d=hyp(P.x-it.x,P.y-it.y);
    if(it.kind==='coin'){if(d<90){it.x+=(P.x-it.x)*Math.min(1,dt*8);it.y+=(P.y-it.y)*Math.min(1,dt*8);}
      if(d<P.r+10){it.done=1;save.money+=it.v;runCoins+=it.v;persist();floatT(it.x,it.y-12,'💰+'+it.v,'#ffd65c',14);sfx(1300,.05,'square',.025,300);}}
    else if(it.lock<=0&&d<P.r+16&&mode==='human'){it.done=pickWeapon(it);}}
  items=items.filter(i=>!i.done);
  // AED
  if(!AED.used&&mode==='human'&&hyp(P.x-AED.x,P.y-AED.y)<34&&P.hp<P.max){AED.used=true;P.hp=P.max;burst(P.x,P.y,'#ffe066',20);toast('⚡ AED 急救！血補滿了！');sfx(500,.4,'sine',.06,600);}
  // 變妖怪模式
  if(mode==='monster'){
    invTimer-=dt;
    if(invSpawned<invTotal&&invTimer<=0){invSpawned++;invTimer=1.4;const e=makeEnemy('human',ELEV.x+rand(-40,40),ELEV.y,null);e.aggro=true;enemies.push(e);
      if(invSpawned===1)toast('🧑‍💼 人類從電梯衝進來了！');}
    if(invSpawned>=invTotal&&!enemies.some(e=>!e.dead&&e.kind==='human'))becomeHuman();
  }
  // 房間清空、秘密通道
  checkT-=dt;if(checkT<=0){checkT=.4;
    ROOMS.forEach((r,i)=>{r.clear=!enemies.some(e=>!e.dead&&e.kind!=='human'&&pip(e.x,e.y,r.pts));});
    if(mode==='human'&&!passage.shown&&ROOMS[passage.room].clear&&!passage.boss)spawnBoss();
    if(passage.boss===1&&!enemies.some(e=>!e.dead&&e.kind==='boss')&&mode==='human'){passage.boss=2;passage.shown=true;toast(`✨ 魔王倒下了！${ROOMS[passage.room].name}的秘密通道打開了`,3000);sfx(1000,.4,'sine',.05,800);}
    refreshButtons();}
  if(passage.shown&&mode==='human'&&hyp(P.x-passage.x,P.y-passage.y)<P.r+22){floorComplete();return;}
  enemies=enemies.filter(e=>!e.dead);
  // 特效
  for(const p of parts){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;}parts=parts.filter(p=>p.t>0);
  for(const f of floats){f.t-=dt;f.y-=30*dt;}floats=floats.filter(f=>f.t>0);
  for(const s of swings)s.t-=dt;swings=swings.filter(s=>s.t>0);
  for(const b of beams)b.t-=dt;beams=beams.filter(b=>b.t>0);
  for(const b of booms)b.t-=dt;booms=booms.filter(b=>b.t>0);
}

/* ---------- 魔王：守在秘密通道前 ---------- */
function spawnBoss(){
  passage.boss=1;const e=makeEnemy('boss',passage.x,passage.y,passage.room);e.aggro=true;e.cd=1.5;e.pat=0;e.touch=0;enemies.push(e);
  shake=16;sfx(70,1,'sawtooth',.1,30);burst(passage.x,passage.y,'#a35cff',40);
  toast(`👹 ${ROOMS[passage.room].name}的秘密通道前跳出了<b>妖怪大王</b>！打倒牠才能進通道`,3400);
  logRec(`👹 ${curFloor} 樓的妖怪大王出現了`);
}
function bossAI(e,dt,d,dx,dy,sp,pr){
  const rage=e.hp<e.max*.5;e.touch-=dt;
  if(e.windB>0){e.windB-=dt;if(e.windB<=0){e.charge=.6;e.hitC=0;sfx(200,.3,'sawtooth',.08,-120);}return;}
  if(e.charge>0){e.charge-=dt;e.x+=e.cdx*(rage?420:340)*dt;e.y+=e.cdy*(rage?420:340)*dt;collide(e);
    if(!e.hitC&&d<pr+8){e.hitC=1;hurtPlayer(22);shake=12;}return;}
  chase(e,sp*(rage?1.25:1),dt);
  if(d<pr+4&&e.touch<=0){e.touch=.8;hurtPlayer(14);}
  if(e.cd>0)return;
  const pat=e.pat++%3;
  if(pat===0){const n=rage?16:12,o=rand(0,1);for(let i=0;i<n;i++){const a=o+i/n*Math.PI*2;bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*220,vy:Math.sin(a)*220,dmg:9,own:'e',life:2.4,r:8,col:'#c06bff'});}
    sfx(150,.3,'square',.06,-60);e.cd=rage?1.3:1.9;}
  else if(pat===1){e.cdx=dx/d;e.cdy=dy/d;e.windB=rage?.35:.55;e.cd=rage?1.4:2;}
  else{for(let i=0;i<(rage?3:2);i++){const a=rand(0,6.28),m=makeEnemy(pick(MONSTER_KINDS),e.x+Math.cos(a)*60,e.y+Math.sin(a)*60,e.room);m.aggro=true;collide(m);enemies.push(m);}
    floatT(e.x,e.y-e.r-20,'出來吧，小妖怪們！','#d9b3ff',15);sfx(300,.4,'sine',.05,-200);e.cd=rage?1.6:2.4;}
}
function bossDown(e){
  e.dead=true;burst(e.x,e.y,'#ffe66d',50);burst(e.x,e.y,'#a35cff',40);shake=20;sfx(660,.6,'triangle',.08,400);
  stat('bosses');logRec(`🏆 打倒 ${curFloor} 樓的妖怪大王！`);
  for(let i=0;i<10;i++)items.push({kind:'coin',v:Math.floor(rand(3,8)),x:e.x+rand(-40,40),y:e.y+rand(-40,40),t:0,lock:0});
  P.hp=Math.min(P.max,P.hp+30);floatT(P.x,P.y-30,'+30 ❤️','#ff8fb1',17);
  floatT(e.x,e.y-50,'妖怪大王變回了大樓管理員！','#bff7c3',16);
}

/* ---------- 樓層繪圖 ---------- */
function polyPath(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();}
function drawEnemy(e){

  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*.8,e.r,e.r*.35,0,0,7);ctx.fill();

    ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(x-6,y-5,5,3,-.5,0,7);ctx.fill();
    ctx.fillStyle='#173d10';ctx.beginPath();ctx.arc(x-5+e.face*2,y,2.6,0,7);ctx.arc(x+5+e.face*2,y,2.6,0,7);ctx.fill();}

  else if(e.kind==='boss'){const rage=e.hp<e.max*.5;ctx.fillStyle=rage?'rgba(255,40,40,.28)':'rgba(160,60,255,.25)';ctx.beginPath();ctx.arc(x,y,e.r+10+Math.sin(T*6)*4,0,7);ctx.fill();
    ctx.save();ctx.translate(x,y);ctx.scale(-e.face,1);emo('👹',0,0,e.r*2.4);ctx.restore();emo('👑',x,y-e.r-8,26);
    if(e.windB>0){txt('!!',x,y-e.r-34,26,'#ff3b3b');ctx.strokeStyle='rgba(255,60,60,.7)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+e.cdx*260,y+e.cdy*260);ctx.stroke();}}
  else{ctx.save();ctx.translate(x,y);ctx.scale(-e.face,1);if(e.kind==='snake'&&e.stab>0)ctx.rotate(.5);emo(ETYPE[e.kind].e,0,0,e.r*2.3);ctx.restore();
    if(e.kind==='banana'){ctx.fillStyle='#a3241b';ctx.fillRect(x-7,y-6,5,2);ctx.fillRect(x+2,y-6,5,2);}}
  if(e.flash>0){ctx.globalAlpha=.6;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,e.r,0,7);ctx.fill();ctx.globalAlpha=1;}
  if(e.frozen>0){ctx.strokeStyle='#8fe3ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,e.r+4,0,7);ctx.stroke();}
  if(e.wind>0){txt('!',x,y-e.r-14,22,'#ff3b3b');ctx.strokeStyle='rgba(255,60,60,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+P.r+38,0,7);ctx.stroke();}
  if(!hostile&&mode==='monster'&&e.kind!=='human')emo('💜',x+e.r*.8,y-e.r*.8,11);
  if(e.hp<e.max&&hostile){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(x-16,y-e.r-10,32,5);ctx.fillStyle='#ff5050';ctx.fillRect(x-16,y-e.r-10,32*Math.max(0,e.hp/e.max),5);}
}
function drawFloor(){
  const z=cam.z=clamp(Math.min(W,H)/440,.62,1.5);
  cam.x+=(P.x-W/2/z-cam.x)*.18;cam.y+=(P.y-H/2/z-cam.y)*.18;

  // 電梯

  // 逃生動線箭頭、滅火器、裝飾

  // AED
  if(!AED.used){ctx.fillStyle='#ff9f1c';ctx.beginPath();ctx.moveTo(AED.x,AED.y-16);ctx.lineTo(AED.x+15,AED.y+11);ctx.lineTo(AED.x-15,AED.y+11);ctx.closePath();ctx.fill();txt('AED',AED.x,AED.y+3,9,'#fff');}
  // 牆
  ctx.strokeStyle='#363c4a';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();for(const w of walls){ctx.moveTo(w.ax,w.ay);ctx.lineTo(w.bx,w.by);}ctx.stroke();
  // 黏液

  // 秘密通道
  if(passage.shown){const pl=1+.15*Math.sin(T*5);ctx.fillStyle='rgba(255,220,90,.35)';ctx.beginPath();ctx.arc(passage.x,passage.y,34*pl,0,7);ctx.fill();emo('🚪',passage.x,passage.y,34);emo('✨',passage.x+18,passage.y-18,18);}
  // 物品
  for(const it of items){const b=Math.sin(T*5+it.x)*3;

    else{const w=WEAPONS[it.w];ctx.fillStyle=w.surprise?'rgba(200,120,255,.45)':'rgba(255,240,120,.45)';ctx.beginPath();ctx.arc(it.x,it.y+b,20,0,7);ctx.fill();emo(w.e,it.x,it.y+b,24);txt(w.n,it.x,it.y+b-26,12,'#3a2f1c');}}

    ctx.fillStyle=f.hp>0?'#9fb8d0':'#9a9a9a';ctx.beginPath();ctx.arc(f.x,f.y+3,11,0,7);ctx.fill();
    emo(f.hp>0?f.face:'😵',f.x,f.y-5,18);if(f.weapon)emo(WEAPONS[f.weapon].e,f.x+10,f.y+6,13);
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(f.x-11,f.y-19,22,3);ctx.fillStyle='#ff8fb1';ctx.fillRect(f.x-11,f.y-19,22*f.hp/f.max,3);}
  // 敵人

      ctx.save();ctx.translate(P.x,P.y);if(P.roll>0)ctx.rotate(T*25);drawHero(0,0,P.r/14,0,P.fx<0?-1:1,Math.atan2(P.fx,P.fy),P.moving);ctx.restore();
      if(P.fy>=-.5)wpn();}}

    else{ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();}}
  for(const l of lobs){const p=l.t/l.T,x=l.sx+(l.tx-l.sx)*p,y=l.sy+(l.ty-l.sy)*p-Math.sin(p*Math.PI)*70;
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(l.sx+(l.tx-l.sx)*p,l.sy+(l.ty-l.sy)*p,8,3,0,0,7);ctx.fill();
    if(l.kind==='grenade')emo('🍍',x,y,20);else if(l.kind==='bomb')emo('💣',x,y,22);
    else{ctx.fillStyle='#6ad04a';ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();}

  for(const b of booms){ctx.fillStyle=`rgba(255,170,60,${b.t/.35*.7})`;ctx.beginPath();ctx.arc(b.x,b.y,b.r*(1.2-b.t),0,7);ctx.fill();}
  for(const p of parts){ctx.fillStyle=p.col;ctx.globalAlpha=Math.min(1,p.t*2);ctx.fillRect(p.x-3,p.y-3,6,6);}ctx.globalAlpha=1;

  ctx.restore();

}
function bar(x,y,w,h,v,col,label){ctx.fillStyle='rgba(0,0,0,.55)';rr(x,y,w,h,h/2);ctx.fill();ctx.fillStyle=col;rr(x+2,y+2,Math.max(0,(w-4)*clamp(v,0,1)),h-4,(h-4)/2);ctx.fill();txt(label,x+10,y+h/2+1,12,'#fff','left',900);}
function drawHUD(){

/* 油漆桶：從點的位置往外找顏色差不多的地方，全部塗滿 */
function fillAt(x,y,col){
  x=Math.floor(clamp(x,0,479));y=Math.floor(clamp(y,0,479));
  const img=dctx.getImageData(0,0,480,480),d=img.data,W0=480,i0=(y*W0+x)*4,sr=d[i0],sg=d[i0+1],sb=d[i0+2];
  const n=parseInt(col.slice(1),16),cr=n>>16&255,cg=n>>8&255,cb=n&255;
  if(Math.abs(sr-cr)+Math.abs(sg-cg)+Math.abs(sb-cb)<12)return;
  pushUndo();
  const tol=110,seen=new Uint8Array(W0*480),st=[x,y],same=i=>Math.abs(d[i]-sr)+Math.abs(d[i+1]-sg)+Math.abs(d[i+2]-sb)<=tol;
  while(st.length){const yy=st.pop(),xx=st.pop();let l=xx;while(l>0&&!seen[yy*W0+l-1]&&same((yy*W0+l-1)*4))l--;
    let up=false,dn=false;
    for(let k=l;k<W0;k++){const p=yy*W0+k;if(seen[p]||!same(p*4))break;seen[p]=1;const q=p*4;d[q]=cr;d[q+1]=cg;d[q+2]=cb;d[q+3]=255;
      if(yy>0){const u=p-W0;if(!seen[u]&&same(u*4)){if(!up){st.push(k,yy-1);up=true;}}else up=false;}
      if(yy<479){const v=p+W0;if(!seen[v]&&same(v*4)){if(!dn){st.push(k,yy+1);dn=true;}}else dn=false;}}}
  // 邊緣抗鋸齒的那一圈也塗上，看起來比較乾淨
  for(let p=0;p<W0*480;p++){if(seen[p])continue;const px=p%W0,py=(p/W0)|0;
    if((px>0&&seen[p-1])||(px<479&&seen[p+1])||(py>0&&seen[p-W0])||(py<479&&seen[p+W0])){const q=p*4,lum=d[q]+d[q+1]+d[q+2];if(lum>360){d[q]=cr;d[q+1]=cg;d[q+2]=cb;}}}
  dctx.putImageData(img,0,0);dr.strokes++;if(col!=='#ffffff')dr.colors.add(col);sfx(520,.12,'sine',.05,300);
}

function castVote(myPick){
  const c=c2(),v=c.vote,r=c.rounds[v.i],A=AUTH();
  if(v.lock===v.i)return;v.lock=v.i;
  const votes=[[0,myPick]];
  RIVALS.forEach((rv,j)=>{const me=j+1;let best=-1,bv=-9;
    for(let k=0;k<5;k++){if(k===me)continue;const val=r.q[k]+rand(0,.3);if(val>bv){bv=val;best=k;}}
    votes.push([me,best]);});
  const got=[0,0,0,0,0];votes.forEach(([,to])=>{got[to]++;v.score[to]++;});
  document.querySelectorAll('[data-v]').forEach(b=>{b.disabled=true;const k=+b.dataset.v;if(k===myPick)b.classList.add('pick');
    $('vt'+k).textContent=votes.filter(x=>x[1]===k).map(x=>A[x[0]].e).join('');
    if(got[k]){const s=document.createElement('span');s.className='plus';s.textContent='+'+got[k];b.appendChild(s);}});
  const j=Math.floor(rand(0,4)),rv=RIVALS[j],to=votes[j+1][1];
  $('vMsg').innerHTML=`${rv.e} <b>${rv.n}</b>：「我投給 ${A[to].e} ${A[to].n}！${pick(rv.say)}」`;
  sfx(880,.1,'triangle',.05,300);
  v.i++;persist();
  const last=v.i>=ROUNDS;
  $('vRow').innerHTML=`<button class="pill ${last?'red':'green'}" id="vNext">${last?'🏆 看結果！':'下一題 ▶'}</button>`;

  stat('contests');if(win)stat('contestWins');save.st.bestVotes=Math.max(save.st.bestVotes||0,sc[0]);
  logRec(win?`🎨 畫畫比賽${tie?'平手':'第一名'}！拿到 ${sc[0]} 分`:`🎨 畫畫比賽輸了（${sc[0]} 分，最高 ${mx} 分）`);

  let h=`<h2>${win?'🏆 你贏了！':'🥈 這次沒有贏……'}</h2>`;
  order.forEach((k,i)=>{h+=`<div class="rank ${sc[k]===mx?'win':''}"><span style="width:28px">${sc[k]===mx?'👑':i+1}</span><span style="width:120px">${A[k].e} ${A[k].n}</span><span class="bar"><i style="width:${mx?sc[k]/mx*100:0}%"></i></span><span>${sc[k]} 分</span></div>`;});
  if(win){

    hideModal();scene='result';
    clearFloor(`${h}<p>${tie?'平手也算贏家！':'你是畫畫冠軍！'}獎金 <b>💰 ${prize}</b> 元，樓梯打開了！</p>`);

     <p>沒有拿第一也沒關係，你完成了比賽！參加獎 <b>💰 ${prize}</b> 元，樓梯一樣打開了。</p>`);

  rubber:{n:'橡皮輪',e:'⚫',col:'#2f3036',bites:2,spd:1.1,price:12,d:'普通，要咬 2 口'},
  bolt:{n:'閃電輪',e:'⚡',col:'#ffcf1f',bites:3,spd:1.5,price:25,d:'逃跑超快！可是妖怪最想吃'},
  iron:{n:'鐵輪',e:'⚙️',col:'#8a94a8',bites:6,spd:.95,price:30,d:'超硬，妖怪要咬 6 口'},
};
const WKEYS=['wood','rubber','bolt','iron'];
const SLOTS=[['front','前輪'],['back','後輪'],['auxL','左輔助輪'],['auxR','右輔助輪']];
const SHOWS_TO_PASS=5,CHASE_TIME=20,UNI_TIME=60;
const STARTER_BIKE={front:'rubber',back:'rubber',auxL:'wood',auxR:'wood'};
const TRICKS=[['丟火把','🔥'],['放開雙手','🙌'],['站上座墊','🧍'],['拋三顆球','⚽'],['轉呼拉圈','⭕'],['吹泡泡','🫧'],['抱貓咪騎車','🐱'],['拋彩帶','🎀'],['頭頂盤子','🍽️'],['拉小提琴','🎻']];
const PERFORMERS=[{n:'阿明',e:'🧑‍🎤'},{n:'小美',e:'👩‍🎤'},{n:'大雄',e:'👨‍🎤'}];
const ARROWS4=['←','↑','→','↓'],DRUMS=['左鼓','右鼓','鈸'];
const b3={ph:'menu',t:0};
function bike(){if(!save.bike)save.bike={...STARTER_BIKE};return save.bike;}
function f3(){if(!save.f3)save.f3={wins:0};return save.f3;}
function mainsN(){const b=bike();return(b.front?1:0)+(b.back?1:0);}
function auxN(){const b=bike();return(b.auxL?1:0)+(b.auxR?1:0);}
function stage3(){const m=mainsN();return m===0?'none':m===1?'uni':auxN()?'stunt':'drum';}
function bikeText(){const b=bike();return SLOTS.filter(([k])=>b[k]).map(([k,n])=>WHEELS[b[k]].e).join('')+`（${['沒有輪子','獨輪車','腳踏車','三輪車','四輪車'][mainsN()+auxN()]}）`;}
function bikeSpeed(){const b=bike(),ws=SLOTS.map(([k])=>b[k]).filter(Boolean);return ws.length?ws.reduce((a,w)=>a+WHEELS[w].spd,0)/ws.length:1;}

function startBike3(){
  scene='bike3';setLayers();bike();f3();persist();
  Object.assign(b3,{ph:'menu',t:0,claps:[],fx:[]});set3Keys();
  showModal(`<h2>🎪 最高樓 3F：妖怪馬戲團</h2>
   <div class="tips">
   <p>🚲 騎著腳踏車上台表演，旁邊坐著一排妖怪觀眾。</p>
   <p>🤹 <b>四輪車（有輔助輪）</b>：表演特技，畫面出現一串箭頭，<b>照順序按</b>。錯太多次（3 次），妖怪就來吃你的輔助輪！</p>
   <p>🥁 <b>兩輪腳踏車</b>：跟人類表演者比打鼓，照順序按鼓。得票最高就贏；輸了妖怪來吃一個輪子。</p>
   <p>🛞 <b>獨輪車</b>：用左右按鈕保持平衡 ${UNI_TIME} 秒。倒下的話最後一個輪子會被吃掉，這層就失敗了。</p>
   <p>🔥 妖怪來吃輪子時快逃！輪子會著火變快，<b>左右換車道</b>閃開妖怪，撐過 ${CHASE_TIME} 秒就賺到錢。</p>
   <p>🛒 表演之間可以去<b>輪子店</b>：🪵木頭輪（一口就被吃）→ ⚫橡皮輪 → ⚡閃電輪（最快，但妖怪最想吃）→ ⚙️鐵輪（最硬）</p>
   <p>🌟 隨時都可以按「⬆️ 上 4 樓」上樓，不用贏、輪子壞了也沒關係！成功表演 ${SHOWS_TO_PASS} 場會自動過關。（現在 ${f3().wins} 場）</p>
   </div><div class="row"><button class="pill red" id="mGo">上台！</button></div>`);
  $('mGo').onclick=hideModal;
}

/* ---------- 按鈕 ---------- */
function set3Keys(){
  const k=$('k3');let h='';
  if(b3.ph==='menu'){
    const st=stage3(),lbl={stunt:'🤹 表演特技',drum:'🥁 打鼓比賽',uni:'🛞 獨輪車平衡'}[st]||'';
    h=`<button class="pill red" id="k3Go" style="font-size:18px;padding:14px 22px">${lbl}</button><button class="pill" id="k3Shop" style="font-size:18px;padding:14px 22px">🛒 輪子店</button><button class="pill green" id="k3Up" style="font-size:18px;padding:14px 22px">⬆️ 上 4 樓</button>`;
  }else if(b3.ph==='stunt')h=ARROWS4.map((a,i)=>`<button class="btn kb" data-k="${i}">${a}</button>`).join('');
  else if(b3.ph==='drum')h=DRUMS.map((a,i)=>`<button class="btn kb wide" data-k="${i}"><span class="em">${i<2?'🥁':'🔔'}</span><small>${a}</small></button>`).join('');
  else if(b3.ph==='chase')h=`<button class="btn kb wide" data-k="0">◀</button><div style="flex:1"></div><button class="btn kb wide" data-k="1">▶</button>`;
  else if(b3.ph==='uni')h=`<button class="btn kb wide" data-h="-1">◀<small>往左</small></button><div style="flex:1"></div><button class="btn kb wide" data-h="1">▶<small>往右</small></button>`;
  k.innerHTML=h;
  if($('k3Go'))$('k3Go').onclick=()=>startShow();
  if($('k3Shop'))$('k3Shop').onclick=openWheelShop;
  if($('k3Up'))$('k3Up').onclick=()=>leave3();
  k.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();key3(+b.dataset.k);b.classList.add('on');setTimeout(()=>b.classList.remove('on'),120);}));
  k.querySelectorAll('[data-h]').forEach(b=>{const d=+b.dataset.h;
    b.addEventListener('pointerdown',e=>{e.preventDefault();b3.hold=d;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}});
    const up=()=>{if(b3.hold===d)b3.hold=0;b.classList.remove('on');};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);});
}
addEventListener('keydown',e=>{
  if(scene!=='bike3'||!$('modal').classList.contains('hidden'))return;
  const c=e.code;
  if(b3.ph==='stunt'){const m={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3,KeyA:0,KeyW:1,KeyD:2,KeyS:3}[c];if(m!==undefined)key3(m);}
  else if(b3.ph==='drum'){const m={KeyJ:0,KeyK:1,KeyL:2,ArrowLeft:0,ArrowRight:1,ArrowUp:2,KeyA:0,KeyD:1,KeyW:2}[c];if(m!==undefined)key3(m);}
  else if(b3.ph==='chase'){if(c==='ArrowLeft'||c==='KeyA')key3(0);if(c==='ArrowRight'||c==='KeyD')key3(1);}
  else if(b3.ph==='uni'){if(c==='ArrowLeft'||c==='KeyA')b3.hold=-1;if(c==='ArrowRight'||c==='KeyD')b3.hold=1;}
});
addEventListener('keyup',e=>{if(b3.ph==='uni'&&['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code))b3.hold=0;});
$('b3Pause').addEventListener('pointerdown',e=>{e.preventDefault();openPause();});
$('b3Rec').addEventListener('pointerdown',e=>{e.preventDefault();if(canPause())openRecords();});

/* ---------- 輪子店 ---------- */
function openWheelShop(){
  if(b3.ph!=='menu'){toast('表演中不能去輪子店，等這場結束吧！');return;}
  const b=bike(),m=mainsN();
  let h=`<h2>🛒 輪子店</h2><p>你有 <b>💰 ${save.money}</b> 元。現在的車子：<b>${bikeText()}</b></p>
   <p style="color:#7a6a4a;font-size:13px">換一顆輪子會把原本那顆換掉。輔助輪要先有前輪和後輪才能裝。</p>`;
  SLOTS.forEach(([k,n])=>{const isAux=k.startsWith('aux'),cur=b[k],need=isAux&&m<2;
    h+=`<div class="shopRow"><span class="slot">${n}：${cur?WHEELS[cur].e+' '+WHEELS[cur].n:'（沒有）'}</span>`;
    WKEYS.forEach(w=>{const W=WHEELS[w];h+=`<button data-buy="${k}|${w}" class="${cur===w?'cur':''}" ${cur===w||need||save.money<W.price?'disabled':''}>${W.e} ${W.n} 💰${W.price}</button>`;});
    h+=need?'<span style="font-size:12px;color:#c4483a">先補齊前後輪</span>':'';h+='</div>';});
  h+=`<div class="tips" style="margin-top:10px">${WKEYS.map(w=>`<p>${WHEELS[w].e} <b>${WHEELS[w].n}</b>：${WHEELS[w].d}</p>`).join('')}</div>
   <div class="row"><button class="pill green" id="mClose">好了</button></div>`;
  showModal(h);
  document.querySelectorAll('[data-buy]').forEach(bt=>bt.onclick=()=>{const[k,w]=bt.dataset.buy.split('|'),W=WHEELS[w];
    if(save.money<W.price)return;save.money-=W.price;bike()[k]=w;persist();sfx(880,.15,'triangle',.06,400);
    logRec(`🛒 買了${W.e}${W.n}裝在${SLOTS.find(x=>x[0]===k)[1]}`);toast(`裝好 ${W.e} ${W.n} 了！`);openWheelShop();});
  $('mClose').onclick=()=>{hideModal();set3Keys();};
}

/* ---------- 開始一場表演 ---------- */
function startShow(){
  const st=stage3();if(st==='none')return;
  b3.t=0;b3.fx=[];b3.claps=[];
  if(st==='stunt'){
    const list=[...TRICKS].sort(()=>Math.random()-.5).slice(0,5);
    Object.assign(b3,{ph:'stunt',tricks:list,ti:0,miss:0,seq:null,gap:1.2,anim:0});
    toast('🤹 照順序按箭頭！錯 3 次妖怪就會生氣',2200);
  }else if(st==='drum'){
    Object.assign(b3,{ph:'drum',ri:0,rounds:4,seq:null,gap:1.2,scores:[],anim:0,
      rivals:PERFORMERS.map(p=>({...p,score:Math.round(rand(58,90))}))});
    toast('🥁 打鼓比賽！照順序按鼓，打得又快又準',2200);
  }else{
    Object.assign(b3,{ph:'uni',ang:rand(-.05,.05),vel:0,wind:0,hold:0,left:UNI_TIME});
    toast(`🛞 按住左右保持平衡 ${UNI_TIME} 秒！`,2200);
  }
  set3Keys();sfx(660,.12,'triangle',.05,300);
}
function newSeq(len,keys,time){b3.seq={k:[...Array(len)].map(()=>Math.floor(rand(0,keys))),i:0,t:time,T:time};}
function key3(k){
  if(b3.ph==='chase'){b3.lane=clamp(b3.lane+(k?1:-1),0,2);sfx(400,.04,'triangle',.03);return;}
  const q=b3.seq;if(!q||b3.gap>0)return;
  if(q.k[q.i]===k){q.i++;sfx(b3.ph==='drum'?[180,240,900][k]:520+q.i*60,.08,b3.ph==='drum'&&k===2?'square':'triangle',.06);
    if(b3.ph==='drum')b3.fx.push({e:k<2?'🥁':'💥',x:k===0?-40:k===1?40:0,t:.4});
    if(q.i>=q.k.length)seqDone(true);}
  else{sfx(120,.2,'sawtooth',.06,-40);shake=6;seqDone(false);}
}
function seqDone(ok){
  const q=b3.seq;
  if(b3.ph==='stunt'){
    const tr=b3.tricks[b3.ti];
    if(ok){b3.anim=1.4;b3.claps=[0,1,2,3].map(i=>({i,t:1.4}));floatT3(`✨ ${tr[0]}成功！`,'#ffe066');sfx(784,.15,'triangle',.06,300);}
    else{b3.miss++;floatT3(b3.miss>=2?'😠 妖怪們開始生氣了……':'😬 出錯了！','#ff8a7a');}
    b3.ti++;b3.seq=null;b3.gap=1.3;
  }else{
    const part=q.i/q.k.length,speed=ok?q.t/q.T:0;b3.scores.push(Math.min(1,part)*80+speed*25);
    floatT3(ok?(speed>.4?'🔥 超快！':'👍 打好了'):'💦 打錯了','#ffe066');
    b3.ri++;b3.seq=null;b3.gap=1.1;
  }
}
const f3txt=[];function floatT3(s,col){f3txt.push({s,col,t:1.4});}

/* ---------- 每一幀 ---------- */
function upd3(dt){
  b3.t+=dt;
  for(const f of f3txt)f.t-=dt;while(f3txt.length&&f3txt[0].t<=0)f3txt.shift();
  for(const c of b3.claps||[])c.t-=dt;b3.claps=(b3.claps||[]).filter(c=>c.t>0);
  for(const f of b3.fx||[])f.t-=dt;b3.fx=(b3.fx||[]).filter(f=>f.t>0);
  if(b3.anim>0)b3.anim-=dt;
  if(b3.ph==='stunt'){
    if(b3.gap>0){b3.gap-=dt;if(b3.gap<=0){
      if(b3.miss>=3){endStunt(false);return;}
      if(b3.ti>=b3.tricks.length){endStunt(true);return;}
      newSeq(3+Math.floor(rand(0,2))+Math.min(2,Math.floor(f3().wins/2)),4,1.0*(5+Math.min(2,Math.floor(f3().wins/2)))+1.4);}}
    else if(b3.seq){b3.seq.t-=dt;if(b3.seq.t<=0){toast('⏰ 太慢了！');seqDone(false);}}
  }else if(b3.ph==='drum'){
    if(b3.gap>0){b3.gap-=dt;if(b3.gap<=0){if(b3.ri>=b3.rounds){endDrum();return;}const L=5+Math.floor(rand(0,3));newSeq(L,3,.85*L+1.6);}}
    else if(b3.seq){b3.seq.t-=dt;if(b3.seq.t<=0){toast('⏰ 太慢了！');seqDone(false);}}
  }else if(b3.ph==='uni'){
    const w=bike().front||bike().back,wf=w==='iron'?.7:w==='bolt'?1.25:1;
    b3.wind+=(rand(-1,1)*2.2-b3.wind*.6)*dt*wf;
    b3.vel+=(b3.ang*2.0+b3.wind*.9+b3.hold*3.4)*dt;b3.vel*=Math.pow(.6,dt);b3.ang+=b3.vel*dt;
    b3.left-=dt;
    if(Math.abs(b3.ang)>1.0){endUni(false);return;}
    if(b3.left<=0){endUni(true);return;}
  }else if(b3.ph==='chase')updChase(dt);
}

/* ---------- 結果 ---------- */
function winShow(money,msg){
  const F=f3();F.wins++;save.money+=money;stat('shows');persist();
  logRec(`🎪 3 樓表演成功：${msg}（💰+${money}）`);
  b3.ph='menu';b3.seq=null;set3Keys();
  sfx(523,.2,'triangle',.06);setTimeout(()=>sfx(784,.3,'triangle',.06),160);
  if(F.wins>=SHOWS_TO_PASS){
    scene='result';setLayers();const w=F.wins;save.f3={wins:0};persist();
    clearFloor(`<h2>🎪🏆 馬戲團大成功！</h2><p>你在 3 樓成功表演了 <b>${w}</b> 場，妖怪觀眾全都站起來拍手！</p><p>最後的車子：${bikeText()}</p>`);
    return;
  }
  showModal(`<h2>👏 ${msg}</h2><p>妖怪們乖乖坐在旁邊拍拍手！賺到 <b>💰 ${money}</b> 元。</p>
   <p>🌟 成功 <b>${F.wins} / ${SHOWS_TO_PASS}</b> 場　💰 現在有 ${save.money} 元</p>
   <div class="row"><button class="pill green" id="mGo">繼續</button></div>`);$('mGo').onclick=hideModal;
}
function endStunt(ok){
  if(ok){winShow(15,'特技表演成功！');return;}
  logRec('😠 特技表演出錯太多次，妖怪來吃輔助輪');
  startChase(['auxL','auxR'],'😠 表演一直出錯，妖怪生氣了！','牠們要來吃你的<b>輔助輪</b>！');
}
function endDrum(){
  const me=Math.round(b3.scores.reduce((a,x)=>a+x,0)/b3.rounds);
  const all=[{n:'我',e:IDS[P.id].e,score:me},...b3.rivals],votes=all.map(()=>0);
  for(let i=0;i<40;i++){const w=all.map(p=>Math.pow(Math.max(1,p.score),4)),tot=w.reduce((a,x)=>a+x,0);let r=Math.random()*tot,k=0;while(r>w[k]){r-=w[k];k++;}votes[k]++;}
  const mx=Math.max(...votes),win=votes[0]===mx&&votes.filter(v=>v===mx).length===1;
  b3.ph='result';set3Keys();
  let h=`<h2>${win?'🥁🏆 打鼓比賽第一名！':'🥁 這次沒有贏……'}</h2><p>觀眾 40 人投票：</p>`;
  all.map((p,i)=>({...p,v:votes[i]})).sort((a,b)=>b.v-a.v).forEach(p=>{h+=`<div class="rank ${p.v===mx?'win':''}"><span style="width:110px">${p.e} ${p.n}</span><span class="bar"><i style="width:${p.v/40*100}%"></i></span><span>${Math.round(p.v/40*100)}%</span></div>`;});
  h+=`<p style="color:#7a6a4a;font-size:13px">你的表演分數 ${me} 分（越準越快分數越高）</p>`;
  if(win){showModal(h+'<div class="row"><button class="pill green" id="mGo">太棒了！</button></div>');$('mGo').onclick=()=>{hideModal();winShow(20,'打鼓比賽得票率最高！');};}
  else{showModal(h+(votes[0]===mx?'<p>平手不算贏喔……</p>':'')+'<div class="row"><button class="pill red" id="mGo">糟糕，妖怪來了！</button></div>');
    $('mGo').onclick=()=>{hideModal();logRec('🥁 打鼓比賽輸了，妖怪來吃輪子');startChase(['front','back'],'🥁 比賽輸了，妖怪衝過來了！','牠們要吃掉你的<b>一個輪子</b>！',1);};}
}
function endUni(ok){
  if(ok){winShow(25,`獨輪車撐了 ${UNI_TIME} 秒！`);return;}
  b3.ph='result';set3Keys();shake=12;sfx(90,.5,'sawtooth',.08,-40);
  const b=bike(),k=b.front?'front':'back',w=WHEELS[b[k]];b[k]=null;
  logRec(`🛞 獨輪車倒下，最後的${w.n}被吃掉了`);
  showModal(`<h2>😵 獨輪車倒下了！</h2><p>妖怪衝過來把你唯一的 ${w.e} ${w.n} 吃掉了……</p>`+'<div class="row"><button class="pill red" id="mGo">嗚嗚……</button></div>');
  $('mGo').onclick=()=>{hideModal();fail3();};
}
// 不管有沒有贏、輪子好不好，都可以上樓
function leave3(wins){
  const w=wins===undefined?f3().wins:wins;b3.ph='result';scene='result';setLayers();save.f3={wins:0};persist();
  clearFloor(`<h2>🎪 馬戲團表演結束</h2><p>你在 3 樓成功表演了 <b>${w}</b> 場${w>=SHOWS_TO_PASS?'，太厲害了！':'。不管表演得怎樣，都可以繼續往上爬！'}</p><p>現在的車子：${bikeText()}</p>`);
}
function fail3(){
  b3.ph='result';set3Keys();
  const w=f3().wins;save.bike={...STARTER_BIKE};save.f3={wins:0};persist();
  logRec('💔 3 樓失敗：輪子全部被吃光了');
  showModal(`<h2>💔 輪子全部被吃光了</h2><p>沒有輪子就不能表演了（成功了 ${w} 場）。沒關係，一樣可以上 4 樓！</p>
   <p>再挑戰的話，會送你一台新的四輪車（⚫⚫ + 🪵🪵），成功場數從 0 開始。之後上樓也會送你這台新車。</p>
   <div class="row"><button class="pill green" id="mUp4">⬆️ 上 4 樓</button><button class="pill red" id="mAgain">🔁 再挑戰</button><button class="pill" id="mHome">🏠 回家</button></div>`);
  $('mAgain').onclick=()=>{hideModal();startBike3();};
  $('mUp4').onclick=()=>{hideModal();leave3(w);};
  $('mHome').onclick=()=>{hideModal();home.ring=false;enterHome();};
}

/* ---------- 逃跑：妖怪來吃輪子 ---------- */
function startChase(slots,title,sub,maxEat){
  const b=bike(),targets=slots.filter(k=>b[k]);
  b3.ph='result';set3Keys();
  showModal(`<h2>${title}</h2><p>${sub}</p><p>🔥 輪子著火了，速度變快！按 ◀ ▶ <b>換車道閃開妖怪</b>，撐過 <b>${CHASE_TIME} 秒</b>就賺到錢。</p>
   ${targets.some(k=>b[k]==='bolt')?'<p>⚡ 小心！妖怪最想吃閃電輪，會一直追著你。</p>':''}

function updVillage(dt){
  const F=f4();V.cool-=dt;
  let mx=0,my=0;const K=input.keys;
  if(K.KeyA||K.ArrowLeft)mx--;if(K.KeyD||K.ArrowRight)mx++;if(K.KeyW||K.ArrowUp)my--;if(K.KeyS||K.ArrowDown)my++;
  if(joy.active){const jx=joy.x-joy.bx,jy=joy.y-joy.by,l=hyp(jx,jy);if(l>8){const m=Math.min(1,l/55);mx+=jx/l*m;my+=jy/l*m;}}
  const ml=hyp(mx,my);if(ml>1){mx/=ml;my/=ml;}
  // 依照鏡頭方向走：往上推＝往畫面裡面走
  const cy=Math.cos(V.yaw),sy=Math.sin(V.yaw),wx=mx*cy+my*sy,wz=-mx*sy+my*cy;
  const sp=idk()==='racer'?230:180;
  if(!vBlocked(V.x+wx*sp*dt,V.y,14))V.x+=wx*sp*dt;if(!vBlocked(V.x,V.y+wz*sp*dt,14))V.y+=wz*sp*dt;
  V.moving=ml>.1;if(V.moving){V.fx=wx;V.fy=wz;}
  if(!V.trail.length||hyp(V.x-V.trail[0].x,V.y-V.trail[0].y)>6){V.trail.unshift({x:V.x,y:V.y});if(V.trail.length>60)V.trail.pop();}
  const tp=V.trail[Math.min(V.trail.length-1,9)]||V;V.petPos.x+=(tp.x-V.petPos.x)*Math.min(1,dt*6);V.petPos.y+=(tp.y-V.petPos.y)*Math.min(1,dt*6);
  for(const f of V.foes){if(f.dead)continue;f.t-=dt;if(f.t<=0){f.t=rand(1,3);f.ang=rand(0,6.28);}
    const nx=f.x+Math.cos(f.ang)*30*dt,ny=f.y+Math.sin(f.ang)*30*dt;if(hyp(nx-f.hx,ny-f.hy)<70&&!vBlocked(nx,ny,18)){f.x=nx;f.y=ny;}else f.ang+=Math.PI;
    if(V.cool<=0&&hyp(f.x-V.x,f.y-V.y)<40){V.cool=1.2;touchFoe(f);return;}}
  let near=null;
  V_BOX_POS.forEach((b,i)=>{if(!F.opened.includes(i)&&hyp(b[0]-V.x,b[1]-V.y)<60)near={k:'box',i};});
  for(const b of V_BUILD){if(b.k==='house')continue;const cx=b.x+b.w/2,cy2=b.y+b.h;if(hyp(cx-V.x,cy2+20-V.y)<80)near={k:b.k};}
  V.near=near;const a=$('v4Act');
  if(near){a.classList.remove('hidden');a.textContent=near.k==='box'?'📦 打開箱子':near.k==='shop'?'🏪 進商店':'🛏️ 睡覺補血';}else a.classList.add('hidden');
}

      add(mk(new THREE.SphereGeometry(.4,12,10),mat,x0+(x1-x0)/Math.abs(x1-x0||1)*len,1.3,0));}
    if(an.a==='spin')for(let i=0;i<14;i++){const a=i*.9+T*10,h=i*.18,r=.5+h*.25;add(mk(new THREE.SphereGeometry(.13,8,6),mat,x1+Math.cos(a)*r,.3+h*Math.min(1,p*2),Math.sin(a)*r));}

    if(an.a==='wave'){const r=.3+p*3.2,t=mk(new THREE.TorusGeometry(r,.08,8,32),mat,x0,1.0,0);t.rotation.y=Math.PI/2;add(t);}

// 位置用 -1~1（盤子半徑 = 1），spin 0~1
function topState(b,ang,power){const r=.75;return{b,x:Math.cos(ang)*r,y:Math.sin(ang)*r,vx:-Math.sin(ang)*(1.15+b.atk*.1)*power,vy:Math.cos(ang)*(1.15+b.atk*.1)*power,

/* 陀螺的「個性」：
   攻擊型：中間拉力弱、亂飄很大、路徑彎來彎去難預測，但很耗力
   防禦型：中間拉力強、很穩，只在中間畫小小的不規則圈
   持久型：穩穩地慢慢晃，最省力；平衡型介於中間 */

  '攻擊':{center:1.6,wander:4.6,theta:2.2,curv:3.0,curvT:3.6,decay:1.35,damp:.8,kick:1.6},
  '防禦':{center:3.6,wander:.75,theta:1.4,curv:.9,curvT:1.2,decay:.8,damp:.5,kick:0},
  '持久':{center:3.0,wander:.55,theta:.9,curv:.7,curvT:.8,decay:.62,damp:.55,kick:0},
  '平衡':{center:2.2,wander:1.8,theta:1.8,curv:1.6,curvT:1.8,decay:1,damp:.68,kick:.35},

function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function stepTop(t,dt){

  const tired=t.spin<.45?1+(.45-t.spin)*5:1;

  t.vx+=-t.x*K.center*dt;t.vy+=-t.y*K.center*dt;
  // 2. 亂飄的力（平滑的隨機，路徑才會不規則，不會一直繞同一圈）
  t.wx=(t.wx||0)+(-(t.wx||0)*K.theta*dt+K.wander*tired*Math.sqrt(dt)*gauss());
  t.wy=(t.wy||0)+(-(t.wy||0)*K.theta*dt+K.wander*tired*Math.sqrt(dt)*gauss());

  if(r>.82&&(t.b.t==='攻擊'||t.b.t==='平衡')){const tx=-ny,ty=nx,dir=Math.sign(t.vx*tx+t.vy*ty)||1;const boost=(t.b.t==='攻擊'?1.3:.8)*t.b.atk/10*Math.min(1,t.spin*1.4);t.vx+=tx*dir*boost*dt;t.vy+=ty*dir*boost*dt;

  t.spin-=dt*.036*K.decay*(1.35-t.b.sta*.06)*(1+Math.hypot(t.vx,t.vy)*.12);

  t.trT=(t.trT||0)-dt;if(t.trT<=0){t.trT=.03;(t.trail=t.trail||[]).push([t.x,t.y]);if(t.trail.length>60)t.trail.shift();}

    if(t.hitT>0&&spd>2.1&&Math.random()<.3){t.out='over';t.alive=false;return;}

}
function angDiff4(a,b){let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;}
const BG={gapA:-Math.PI/2,gapW:.7};   // 極限線在盤子「上方」（畫面上）

function stat(k,n){save.st=save.st||{};save.st[k]=(save.st[k]||0)+(n||1);}
function logRec(t){save.st=save.st||{};const d=new Date(),L=save.st.log=save.st.log||[];
  L.unshift({d:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,t});
  if(L.length>30)L.length=30;persist();}
function fmtTime(t){t=Math.floor(t||0);const h=Math.floor(t/3600),m=Math.floor(t/60)%60;return h?`${h} 小時 ${m} 分`:`${m} 分 ${t%60} 秒`;}
function openRecords(){
  if(scene!=='home'&&!$('modal').classList.contains('hidden')&&!document.getElementById('pRes'))return;
  input.atk=false;input.keys={};joy.active=false;
  const st=save.st||{},c=save.c2,cur=scene==='home'?(save.floor||1):curFloor;
  const box=(v,l)=>`<div class="st"><b>${v}</b><span>${l}</span></div>`;
  let h=`<h2>📜 我的紀錄</h2><div class="stats">
    ${box(cur+' 樓','現在在')}${box(Math.max(save.best||1,cur)+' 樓','最高到過')}${box(save.clears||0,'過關次數')}${box(save.tops||0,'登上 100 樓')}
    ${box(st.rescued||0,'救回的人')}${box(st.monster||0,'變成妖怪')}${box(st.bosses||0,'打倒魔王')}${box(st.climbs||0,'攀岩進大樓')}${box(st.pets||0,'孵出寵物')}${box(st.battles||0,'寵物對戰勝利')}${box(st.beyWins||0,'陀螺對戰勝利')}${box(st.fish||0,'抓到的魚')}${box(st.wet||0,'被魚拉下河')}${box(st.landings||0,'飛機安全降落')}${box(st.crashes||0,'飛機墜機')}${box(st.raceWins||0,'飛機比賽冠軍')}${box(st.paxTrips||0,'載客趟數')}${box(st.pax||0,'載過的乘客')}${box(((save.f7&&save.f7.owned)||['cessna']).length+' / 7','擁有的飛機')}${box((st.contestWins||0)+' / '+(st.contests||0),'畫畫比賽 贏／比')}${box(st.shows||0,'馬戲團成功表演')}${box(st.escapes||0,'逃過妖怪')}${box(st.bestVotes||0,'畫畫最高分')}
    ${box('💰 '+save.money,'現在的錢')}${box((save.toys||[]).length+' / '+TOYS.length,'收集的玩具')}${box(fmtTime(st.time),'一共玩了')}${box(IDS[P.id].e+' '+IDS[P.id].n,'現在的身分')}
  </div>`;
  const now=c&&c.rounds&&c.rounds.length?c.rounds.map(r=>r.imgs[0]):null,pics=now||st.lastPics;
  if(pics&&pics.length)h+=`<h3>🖼️ ${now?`這次畫畫比賽畫好的圖（${pics.length}/${ROUNDS}）`:'上一次畫畫比賽我畫的圖'}</h3><div class="gal">${pics.map(s=>`<img src="${s}" alt="">`).join('')}</div>`;
  const L=st.log||[];
  h+=`<h3>🕒 最近發生的事</h3>${L.length?`<ul class="log">${L.slice(0,12).map(x=>`<li><small>${x.d}</small>${x.t}</li>`).join('')}</ul>`:'<p style="color:#9c8a66">還沒有紀錄，去最高樓救人吧！</p>'}
   <p style="color:#7a6a4a;font-size:13px;margin-top:8px">💾 紀錄會自動存在這支手機的瀏覽器裡。</p>
   <div class="row"><button class="pill green" id="rClose">關閉</button></div>`;
  showModal(h);$('rClose').onclick=hideModal;
}
$('hRec').onclick=openRecords;
$('bRec').addEventListener('pointerdown',e=>{e.preventDefault();if(canPause())openRecords();});

/* ---------- 暫停 / 存檔 ---------- */
function canPause(){return (scene==='floor'||scene==='drive'||scene==='draw2'||scene==='bike3'||scene==='climb'||scene==='village'||scene==='battle'||scene==='zoo'||scene==='bey'||scene==='beycam'||scene==='river'||scene==='fish'||scene==='dive'||scene==='air'||scene==='fly'||scene==='salv')&&$('modal').classList.contains('hidden')&&!drawUIOpen();}
function openPause(){
  if(!canPause())return;
  input.atk=false;input.keys={};joy.active=false;
  showModal(`<h2>⏸ 暫停</h2>
   <p>🏢 現在在 <b>${scene==='drive'?'開車去最高樓的路上':scene==='climb'?'大樓外牆，'+climbFloorNow()+' 樓的高度':curFloor+' 樓'}</b>（最高紀錄 ${Math.max(save.best||1,curFloor)} 樓）</p>
   <p>💰 ${save.money} 元　🎖️ 過關 ${save.clears} 次</p>
   ${scene==='bike3'?`<p>🚲 特技秀：成功 ${(save.f3&&save.f3.wins)||0} / ${SHOWS_TO_PASS} 場　車子：${bikeText()}</p>`:''}
   ${scene==='draw2'?`<p>🎨 畫畫比賽：已經畫了 ${(save.c2&&save.c2.rounds.length)||0} / 10 張（畫好的圖都有存起來）</p>`:''}
   <p style="color:#7a6a4a">💾 存檔會記住樓層、錢和玩具。回家後接電話，會從這一層的開頭繼續。</p>
   <div class="row"><button class="pill green" id="pRes">▶️ 繼續</button><button class="pill blue" id="pSave">💾 存檔回家</button><button class="pill red" id="pRec">📜 看紀錄</button></div>
   ${!['climb','battle','bey','beycam','fish','dive','fly','salv'].includes(scene)?`<div class="row"><button class="pill" id="pClimb">🧗 爬外牆換樓層</button></div>`:''}`);
  $('pRes').onclick=hideModal;
  if($('pClimb'))$('pClimb').onclick=()=>{hideModal();const f=scene==='drive'?1:curFloor;$('cv4').style.display='none';logRec(`🧗 從 ${f} 樓爬到外牆`);startClimb(f);};
  $('pRec').onclick=openRecords;
  $('pSave').onclick=()=>{persist();hideModal();home.ring=false;enterHome();toast('💾 已存檔！按「📞 等任務電話」就能繼續',2600);};
}
$('bPause').addEventListener('pointerdown',e=>{e.preventDefault();openPause();});
$('bPause2').addEventListener('pointerdown',e=>{e.preventDefault();openPause();});
addEventListener('keydown',e=>{if(e.code==='KeyP'||e.code==='Escape'){if(canPause())openPause();else if(document.getElementById('pRes'))hideModal();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&canPause())openPause();});

/* ---------- 按鈕狀態 ---------- */
let lastBtn='';
function refreshButtons(){
  const mon=mode==='monster',k=idk();
  const holders=followers.filter(f=>f.weapon);
  const sig=[mon,k,P.weapon,holders.map(f=>f.weapon).join(),followers.reduce((s,f)=>s+f.hp,0),P.id].join('|');if(sig===lastBtn)return;lastBtn=sig;
  $('atkEm').textContent=mon?'👹':WEAPONS[P.weapon].e;
  $('swapEm').textContent=mon?'🚫':(holders.length?WEAPONS[holders[0].weapon].e:'🔄');
  $('healTxt').textContent=mon?'—':'補血 '+followers.reduce((s,f)=>s+f.hp,0);
  $('idEm').textContent=mon?'👹':IDS[P.id].e;$('idEm2').textContent=IDS[P.id].e;
  $('bRoll').classList.toggle('hidden',mon||k!=='stunt');
}
function setLayers(){
  $('ctlFloor').classList.toggle('hidden',scene!=='floor'&&scene!=='draw2');
  ['bAtk','bSwap','bHeal','bRoll'].forEach(id=>$(id).style.visibility=scene==='draw2'?'hidden':'');
  $('ctlDrive').classList.toggle('hidden',scene!=='drive');
  $('ctl3').classList.toggle('hidden',scene!=='bike3');
  $('ctl4').classList.toggle('hidden',scene!=='village');['bt4','bt4Top','bt4Fx'].forEach(id=>$(id).classList.toggle('hidden',scene!=='battle'));
  $('cv4').style.display=(scene==='village'||scene==='battle'||scene==='zoo'||scene==='bey'||scene==='river'||scene==='fish'||scene==='dive'||scene==='air'||scene==='fly'||scene==='salv'||(scene==='result'&&(curFloor===4||curFloor===5||curFloor===6||curFloor===7)))?'block':'none';
  $('air7').classList.toggle('hidden',scene!=='air');$('fly7').classList.toggle('hidden',scene!=='fly');$('salv7').classList.toggle('hidden',scene!=='salv');
  $('ctl6').classList.toggle('hidden',scene!=='river');$('fish6').classList.toggle('hidden',scene!=='fish');$('dive6').classList.toggle('hidden',scene!=='dive');
  $('ctl5').classList.toggle('hidden',scene!=='zoo');$('bey5').classList.toggle('hidden',scene!=='bey');
  ['cbVid','cbCv','cbTop','cbPanel','cbMsg'].forEach(id=>$(id).classList.toggle('hidden',scene!=='beycam'));
  $('ctlClimb').classList.toggle('hidden',scene!=='climb');$('cvClimb').style.display=scene==='climb'?'block':'none';
  $('ctlHome').classList.toggle('hidden',scene!=='home');
  $('joyPad').classList.toggle('hidden',!['floor','draw2','village','zoo','river','dive','fly'].includes(scene));resetKnob();
  joy.active=false;input.atk=false;lastBtn='';refreshButtons();
}
/* 固定搖桿：圓心就是起點，拖動中間的小圓決定走的方向 */
const JP=$('joyPad'),JK=$('joyKnob');
function resetKnob(){JK.style.transform='';}
function jpMove(e){const r=JP.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2-14;
  joy.bx=cx;joy.by=cy;let dx=e.clientX-cx,dy=e.clientY-cy;const l=Math.hypot(dx,dy);if(l>R){dx*=R/l;dy*=R/l;}
  // 遊戲用 55 當最大推力，換算成同樣比例
  joy.x=cx+dx/R*55;joy.y=cy+dy/R*55;JK.style.transform=`translate(${dx}px,${dy}px)`;}
JP.addEventListener('pointerdown',e=>{e.preventDefault();joy.active=true;joy.id=e.pointerId;try{JP.setPointerCapture(e.pointerId);}catch(_){}jpMove(e);});
JP.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.id)jpMove(e);});
const jpEnd=e=>{if(e.pointerId===joy.id){joy.active=false;resetKnob();}};JP.addEventListener('pointerup',jpEnd);JP.addEventListener('pointercancel',jpEnd);

/* ---------- 輸入 ---------- */
const jz=$('joyZone');
jz.addEventListener('pointerdown',e=>{e.preventDefault();if(joy.active)return;joy.active=true;joy.id=e.pointerId;joy.bx=joy.x=e.clientX;joy.by=joy.y=e.clientY;try{jz.setPointerCapture(e.pointerId);}catch(_){}});
jz.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY;}});
const endJoy=e=>{if(e.pointerId===joy.id)joy.active=false;};
jz.addEventListener('pointerup',endJoy);jz.addEventListener('pointercancel',endJoy);
function holdBtn(el,on,off){el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');try{el.setPointerCapture(e.pointerId);}catch(_){}on();});
  const end=()=>{el.classList.remove('on');off&&off();};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);}
holdBtn($('bAtk'),()=>{input.atk=true;},()=>{input.atk=false;});
holdBtn($('bSwap'),doSwap);holdBtn($('bHeal'),doHeal);holdBtn($('bId'),openIdentity);holdBtn($('bRoll'),doRoll);
cv.addEventListener('pointerdown',e=>{if(scene==='home')homeTap(e.clientX,e.clientY);});
addEventListener('keydown',e=>{input.keys[e.code]=true;
  if(scene==='drive'){if(e.code==='ArrowLeft'||e.code==='KeyA')laneMove(-1);if(e.code==='ArrowRight'||e.code==='KeyD')laneMove(1);}
  if(scene==='floor'){if(e.code==='KeyK')doSwap();if(e.code==='KeyL')doHeal();if(e.code==='KeyQ')openIdentity();if(e.code==='ShiftLeft'||e.code==='ShiftRight')doRoll();}
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>{input.keys[e.code]=false;});
addEventListener('blur',()=>{input.keys={};input.atk=false;joy.active=false;});

/* ---------- 主迴圈 ---------- */
let last=performance.now();
function frame(now){
  let dt=Math.min(.033,(now-last)/1000);last=now;T+=dt;shake=Math.max(0,shake-dt*40);
  const paused=!$('modal').classList.contains('hidden');
  if(!paused&&(scene==='floor'||scene==='drive'||scene==='draw2'||scene==='bike3'||scene==='climb'||scene==='village'||scene==='battle'||scene==='zoo'||scene==='bey'||scene==='beycam'||scene==='river'||scene==='fish'||scene==='dive'||scene==='air'||scene==='fly'||scene==='salv')&&!(dr.open&&dr.paused)){save.st.time=(save.st.time||0)+dt;if((save.st.time%10)<dt)persist();}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(scene==='home')drawHome(dt);
  else if(scene==='drive'){if(!paused)updDrive(dt);ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));drawDrive();ctx.restore();}
  else if(scene==='draw2'){if(!paused&&!dr.open)updDraw2(dt);drawDraw2();if(dr.open)updDrawUI(dt);}
  else if(scene==='bike3'){if(!paused)upd3(dt);draw3();}
  else if(scene==='village'){if(!paused)updVillage(dt);drawVillage();}
  else if(scene==='battle'){if(!paused)updBattle(dt);drawBattle();}
  else if(scene==='zoo'){if(!paused)updZoo(dt);drawZoo();}
  else if(scene==='bey'){if(!paused)updBey(dt);drawBey();}
  else if(scene==='beycam'){if(!paused)updCam(dt);drawCam();}
  else if(scene==='river'){if(!paused)updRiver(dt);drawRiver();}
  else if(scene==='fish'){if(!paused)updFish(dt);drawFish();}
  else if(scene==='dive'){if(!paused)updDive(dt);drawDive();}
  else if(scene==='air')drawAir();
  else if(scene==='fly'){if(!paused)updFly(dt);drawFly();}
  else if(scene==='salv'){if(!paused)updSalv(dt);drawSalv();}
  else if(scene==='climb'){if(!paused)updClimb(dt);drawClimb();}
  else if(scene==='floor'||scene==='result'){if(!paused&&scene==='floor')updFloor(dt);if(curFloor===2&&scene==='result')drawDraw2();else if(curFloor===3&&scene==='result')draw3();else if(curFloor===4&&scene==='result')drawVillage();else if(curFloor===5&&scene==='result')drawZoo();else if(curFloor===6&&scene==='result')drawRiver();else if(curFloor===7&&scene==='result')drawAir();else drawFloor();}
  requestAnimationFrame(frame);
}
P.r=idk()==='kid'?11:14;
enterHome();
toast('📞 電話響了！點電話接聽',3000);
requestAnimationFrame(frame);
</script>
